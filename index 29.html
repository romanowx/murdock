<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="222">
<meta name="format-detection" content="telephone=no">
<title>222 — лента рынка 24/7</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230A0D12'/><rect x='20' y='30' width='60' height='7' rx='3' fill='%23F7931A'/><rect x='20' y='47' width='44' height='7' rx='3' fill='%23E9EEF6'/><rect x='20' y='64' width='30' height='7' rx='3' fill='%235C8DF6'/></svg>">
<style>
:root{
  --bg:#0A0D12; --panel:#111721; --panel2:#161E2A; --line:#1E2734; --line2:#2A3644;
  --tx:#E9EEF6; --mut:#8695A8; --dim:#5C6B7E;
  --crypto:#F7931A; --oil:#2FA37A; --gold:#D6A72B; --silver:#A9BACD; --macro:#5C8DF6;
  --ok:#2FBF71; --info:#4C9AFF; --warn:#E5A93D; --risk:#E8603C;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
  --top:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}

/* ---------- ШАПКА ---------- */
.top{
  position:sticky; top:0; z-index:40; background:rgba(10,13,18,.92);
  backdrop-filter:saturate(140%) blur(14px); -webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top-in{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;max-width:900px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:7px;font-weight:800;letter-spacing:.14em;font-size:15px}
.brand em{font-style:normal;color:var(--dim);font-weight:600;letter-spacing:.18em;font-size:10px;font-family:var(--mono)}
.live{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;margin-left:auto}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:p 2.4s infinite}
.pulse.off{background:var(--risk);animation:none}
.pulse.load{background:var(--warn)}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(47,191,113,.55)}70%{box-shadow:0 0 0 8px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mut);border:1px solid transparent}
.iconbtn:active{background:var(--panel2)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- ФИЛЬТРЫ ---------- */
.chips{
  position:sticky; top:calc(var(--top) + env(safe-area-inset-top)); z-index:35;
  background:rgba(10,13,18,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex; gap:7px; padding:9px 14px; overflow-x:auto; scrollbar-width:none;
  max-width:900px;margin:0 auto;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1px solid var(--line2);
  color:var(--mut); font-size:13.5px; font-weight:600; white-space:nowrap; transition:.12s;
}
.chip[aria-pressed="true"]{background:var(--tx);color:#0A0D12;border-color:var(--tx)}
.chipsep{flex:0 0 auto;width:1px;align-self:stretch;background:var(--line2);margin:3px 3px}
.tag.tp{color:var(--macro);border-color:rgba(92,141,246,.35);background:rgba(92,141,246,.1);font-family:var(--sans);font-weight:700;font-size:10.5px}
.chip i{font-style:normal;margin-right:5px}

.wrap{max-width:900px;margin:0 auto;padding:0 14px calc(88px + env(safe-area-inset-bottom))}

/* ---------- ПОИСК ---------- */
.search{display:none;padding:10px 0 2px}
.search.on{display:block}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  padding:11px 13px;outline:none;
}
.search input:focus{border-color:var(--macro)}

/* ---------- НОВЫЕ ---------- */
.newbar{
  position:fixed;left:50%;transform:translateX(-50%);z-index:38;
  top:calc(var(--top) + 58px + env(safe-area-inset-top));
  background:var(--macro);color:#fff;font-size:13px;font-weight:700;
  padding:8px 16px;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.5);
  display:none;
}
.newbar.on{display:block;animation:drop .3s ease}
@keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- КАРТОЧКА ---------- */
.feed{display:flex;flex-direction:column;gap:9px;padding-top:11px}
.card{
  display:flex; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; position:relative;
}
.card.isnew{border-color:rgba(92,141,246,.45)}
.card.enter{animation:enter .42s cubic-bezier(.32,.72,0,1)}
@keyframes enter{
  0%{opacity:0;transform:translateY(-10px);background:#182233}
  60%{background:#182233}
  100%{opacity:1;transform:none;background:var(--panel)}
}
.ip{
  font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.09em;
  border-radius:5px;padding:2px 5px;border:1px solid;
}
.ip3{color:var(--risk);background:rgba(232,96,60,.13);border-color:rgba(232,96,60,.45)}
.ip2{color:var(--warn);background:rgba(229,169,61,.12);border-color:rgba(229,169,61,.4)}
.act.strict.on{background:var(--tx);color:#0A0D12;border-color:var(--tx)}
.nb{
  font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.1em;
  color:var(--macro);background:rgba(92,141,246,.15);border:1px solid rgba(92,141,246,.45);
  border-radius:5px;padding:2px 5px;
}
.spine{width:3px;flex:0 0 3px;background:var(--mut)}
.card[data-cat*="crypto"] .spine{background:var(--crypto)}
.card[data-cat*="oil"] .spine{background:var(--oil)}
.card[data-cat*="gold"] .spine{background:var(--gold)}
.card[data-cat*="silver"] .spine{background:var(--silver)}
.card[data-cat*="macro"] .spine{background:var(--macro)}
.cbody{padding:12px 13px 11px;flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em;margin-bottom:7px}
.meta .src{color:var(--mut);font-weight:600}
.trust{
  display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:999px;
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:0;border:1px solid;
}
.trust b{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.t3{color:var(--ok);border-color:rgba(47,191,113,.35);background:rgba(47,191,113,.1)}
.t2{color:var(--info);border-color:rgba(76,154,255,.3);background:rgba(76,154,255,.09)}
.t1{color:var(--warn);border-color:rgba(229,169,61,.32);background:rgba(229,169,61,.1)}
.t0{color:var(--risk);border-color:rgba(232,96,60,.34);background:rgba(232,96,60,.1)}
.conf{color:var(--ok);font-family:var(--sans);font-size:11px;font-weight:700}
.ttl{margin:0;font-size:16.5px;line-height:1.32;font-weight:650;letter-spacing:-.01em}
.orig{margin:6px 0 0;font-size:12.5px;line-height:1.4;color:var(--dim)}
.sum{margin:7px 0 0;font-size:14px;line-height:1.45;color:var(--mut)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:5px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.act{
  font-size:13px;font-weight:650;padding:7px 12px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--tx);
}
.act:active{background:var(--line)}
.act.ghost{background:none;color:var(--mut)}

/* ---------- КАЛЕНДАРЬ ---------- */
.next{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);border-radius:var(--r);padding:15px;margin-top:12px;
}
.next .lbl{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.next h3{margin:7px 0 3px;font-size:18px;font-weight:700}
.cd{font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.next .when{color:var(--mut);font-size:13px}
.daygrp{margin-top:20px}
.dayhd{
  display:flex;align-items:baseline;gap:9px;padding-bottom:7px;margin-bottom:2px;
  border-bottom:1px solid var(--line);
}
.dayhd b{font-size:14.5px;font-weight:700}
.dayhd span{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.dayhd.today b{color:var(--macro)}
.ev{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev .tm{font-family:var(--mono);font-size:12.5px;color:var(--mut);flex:0 0 46px;padding-top:2px;font-variant-numeric:tabular-nums}
.ev .en{flex:1;min-width:0}
.ev .en b{display:block;font-size:14.5px;font-weight:620;line-height:1.3}
.ev .en p{margin:3px 0 0;font-size:12.5px;color:var(--dim);line-height:1.4}
.imp{display:flex;gap:2.5px;padding-top:6px;flex:0 0 auto}
.imp i{width:5px;height:5px;border-radius:50%;background:var(--line2);display:block}
.imp.i1 i:nth-child(1),.imp.i2 i:nth-child(-n+2),.imp.i3 i{background:var(--warn)}
.imp.i3 i{background:var(--risk)}
.ev.past{opacity:.34}
.est{font-family:var(--mono);font-size:9.5px;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:1px}

/* ---------- НИЗ ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(10,13,18,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
}
.nav button{
  flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);font-size:10.5px;font-weight:600;letter-spacing:.02em;
}
.nav button[aria-pressed="true"]{color:var(--tx)}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- ШТОРКА ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);visibility:hidden;
}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet-top{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
  padding-top:calc(12px + env(safe-area-inset-top));flex:0 0 auto;
}
.sheet-top b{font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(40px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;width:100%}
.sheet-body h2{font-size:21px;line-height:1.28;margin:0 0 10px;font-weight:700;letter-spacing:-.015em}
.artmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:14px}
.arttext{font-size:16.5px;line-height:1.62;color:#DCE4EE}
.arttext p{margin:0 0 15px}
.skel{height:13px;background:var(--panel2);border-radius:6px;margin-bottom:10px;animation:sk 1.3s infinite}
.skel:nth-child(2n){width:88%}.skel:nth-child(3n){width:72%}
@keyframes sk{0%,100%{opacity:.45}50%{opacity:.85}}
.linkbox{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:18px}
.linkbox .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:11px}
.lrow{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0;padding-top:0}
.lrow p{margin:0;font-size:14px;line-height:1.5;color:var(--mut);flex:1;min-width:0}
.ax{
  flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;
  border:1px solid;white-space:nowrap;margin-top:1px;
}
.ax-oil{color:var(--oil);border-color:rgba(47,163,122,.4);background:rgba(47,163,122,.1)}
.ax-gold{color:var(--gold);border-color:rgba(214,167,43,.4);background:rgba(214,167,43,.1)}
.ax-silver{color:var(--silver);border-color:rgba(169,186,205,.35);background:rgba(169,186,205,.09)}
.ax-crypto{color:var(--crypto);border-color:rgba(247,147,26,.4);background:rgba(247,147,26,.1)}
.dir{flex:0 0 auto;font-size:15px;font-weight:800;line-height:1.35;width:14px;text-align:center}
.dir.up{color:var(--ok)}.dir.down{color:var(--risk)}.dir.flat{color:var(--dim)}
.linkbox .disc{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.45}
.aibox{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:16px}
.figs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.fig{
  flex:1 1 128px;background:var(--panel);border:1px solid var(--line2);border-radius:11px;
  padding:9px 11px;min-width:0;
}
.fig span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig b{font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.fig.up{border-color:rgba(47,191,113,.4)}
.fig.up b{color:var(--ok)}
.fig.down{border-color:rgba(232,96,60,.4)}
.fig.down b{color:var(--risk)}
.arttext p.datarow{
  font-family:var(--mono);font-size:13.5px;line-height:1.5;color:var(--mut);
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:9px;
}
.aibox .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--macro);text-transform:uppercase;margin-bottom:8px}
.trustbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:16px;font-size:13.5px;color:var(--mut);line-height:1.5}
.trustbox ul{margin:8px 0 0;padding-left:18px}
.trustbox li{margin-bottom:4px}

/* ---------- НАСТРОЙКИ ---------- */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px;font-weight:600}
.row .rt span{font-size:12.5px;color:var(--dim);line-height:1.4}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 auto;transition:.18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s}
.sw[aria-pressed="true"]{background:var(--ok)}
.sw[aria-pressed="true"]::after{transform:translateX(18px)}
.fld{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none;margin-top:8px}
.fld:focus{border-color:var(--macro)}
.hint{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.srcline{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srcline .st{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--line2)}
.srcline .st.ok{background:var(--ok)}.srcline .st.bad{background:var(--risk)}
.srcline .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
h4.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:26px 0 4px;font-weight:600}

.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty b{display:block;color:var(--mut);font-size:16px;margin-bottom:6px}
.more{width:100%;padding:14px;margin-top:12px;border:1px dashed var(--line2);border-radius:12px;color:var(--mut);font-weight:600;font-size:14px}
.foot{text-align:center;color:var(--dim);font-size:11.5px;line-height:1.6;padding:26px 10px 6px}

@media (min-width:760px){
  .ttl{font-size:17.5px}
  .nav{position:sticky;bottom:0}
  .feed{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">222 <em id="ver">ЛЕНТА</em></div>
    <div class="live"><span class="pulse" id="pulse"></span><span id="lastup">запуск…</span></div>
    <button class="iconbtn" id="btnSearch" aria-label="Поиск">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="iconbtn" id="btnRefresh" aria-label="Обновить">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>
</header>

<div class="chips" id="chips"></div>

<main class="wrap">
  <div class="search" id="searchBox"><input id="q" type="search" placeholder="Поиск по ленте: BTC, ОПЕК, ставка…" autocomplete="off"></div>
  <div id="viewNews">
    <div class="feed" id="feed"></div>
    <button class="more" id="moreBtn" hidden>Показать ещё</button>
  </div>
  <div id="viewCal" hidden></div>
  <div class="foot" id="foot"></div>
</main>

<div class="newbar" id="newbar"></div>

<nav class="nav">
  <button id="tabNews" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Лента</button>
  <button id="tabCal" aria-pressed="false">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календарь</button>
  <button id="tabSet" aria-pressed="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1.5z"/></svg>Настройки</button>
</nav>

/* Ловим любую ошибку и показываем её, вместо того чтобы оставлять пустой экран */
(function(){
  var shown = false;
  function boom(msg){
    if(shown) return; shown = true;
    var d = document.getElementById('crash');
    if(!d) return;
    d.innerHTML = '<div style="margin:14px;padding:14px;border:1px solid #E8603C;border-radius:12px;'+

      '<br><br>Покажи этот текст — по нему сразу видно, что чинить.</div>';
  }
  window.addEventListener('error', function(e){ boom(e.message || 'неизвестная ошибка'); });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason; boom((r && r.message) || r || 'запрос не выполнен');
  });
})();

/* Сколько запросов прямо сейчас висит на каждом зеркале — по этому и распределяем */
const inflight = new Array(PROXY.length).fill(0);
/* Пока зеркала не проверены, идём по проверенному временем порядку */
const PROXY_PRIORITY = [0, 2, 3, 1, 4, 8, 9, 5, 6, 7, 10];

let bestProxy = store.get('proxy', 0);
/* Проверяем все зеркала разом и запоминаем ВСЕ рабочие.
   Браузер держит лишь около шести соединений к одному хосту — раскидывая
   ленты по нескольким зеркалам, мы качаем их втрое быстрее. */
let goodProxies = [];
async function pickProxy(){
  const probe = 'https://forklog.com/feed/';
  const res = await Promise.allSettled(PROXY.map(async (p,i)=>{
    if(p.asJson || p.raw) throw 0;
    const t = await grab(p.f(probe), 6000);
    if(!t || t.indexOf('<') < 0) throw 0;
    return i;
  }));
  goodProxies = res.filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(goodProxies.length){ bestProxy = goodProxies[0]; store.set('proxy', bestProxy); }
}

const PROXY_TEXT = 'https://api.allorigins.win/raw?url=';

async function grab(url, ms){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), ms||8000);
  try{
    const r = await fetch(url, {signal:c.signal, cache:'no-store', redirect:'follow'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const txt = await r.text();
    if(!txt) throw new Error('пусто');
    return txt;
  } finally { clearTimeout(t); }
}

/* Возвращает {xml:...} или {json:...}.
   Разные ленты стартуют с разных зеркал — так ни одно не упирается в лимит. */
const penalty = new Array(PROXY.length).fill(0);
function proxyOrder(seed){
  const g = goodProxies.length ? goodProxies : PROXY_PRIORITY;
  // сначала то зеркало, на котором меньше всего висящих запросов;
  // при равенстве — сдвиг по номеру ленты, чтобы не толпиться на одном
  const sorted = g.slice().sort((a,b)=>
    (inflight[a]-inflight[b]) || (penalty[a]-penalty[b]) ||
    (((a-seed+99*g.length)%g.length) - ((b-seed+99*g.length)%g.length)));
  const rest = PROXY.map((p,i)=>i).filter(i=>g.indexOf(i) < 0);
  return sorted.concat(rest);
}
async function grabFeed(url, seed){
  // зеркала кэшируют ответы, поэтому подмешиваем метку времени с шагом в минуту
  const bust = (url.indexOf('?')>-1 ? '&' : '?') + '_t=' + Math.floor(Date.now()/60000);
  url = url + bust;
  let err = 'нет ответа';
  for(const i of proxyOrder(seed||0).slice(0, 6)){
    const p = PROXY[i];
    inflight[i]++;
    try{
      const raw = await grab(p.f(url), 8000);
      if(p.asJson){
        const j = JSON.parse(raw);
        if(p.jsonFeed){
          if(!j.items || !j.items.length) throw new Error('пустой ответ');
          useProxy(i);
          return {json:{items: j.items.map(x=>({
            title: x.title, link: x.url || x.external_url,
            pubDate: x.date_published || x.date_modified,
            description: x.summary || x.content_text || ''
          }))}};
        }
        if(j.status!=='ok' || !j.items || !j.items.length) throw new Error('пустой ответ');
        useProxy(i); return {json:j};
      }
      let txt = raw;
      if(p.unwrap){ txt = (JSON.parse(raw)[p.unwrap]) || ''; }
      if(txt.length>200 && txt.indexOf('<item')+txt.indexOf('<entry') > -2){
        useProxy(i); return {xml:txt};
      }
      throw new Error('не похоже на RSS');
    }catch(e){
      penalty[i] = Math.min(20, penalty[i]+1);
      err = e.message||'сбой';
    } finally { inflight[i] = Math.max(0, inflight[i]-1); }
  }
  throw new Error(err);
}
function useProxy(i){
  penalty[i] = Math.max(0, penalty[i]-2);
  if(bestProxy!==i){ bestProxy=i; store.set('proxy', i); }
}

/* ---------- 6. РАЗБОР RSS ---------- */
function clean(html){
  if(!html) return '';
  const d = document.createElement('div');
  d.innerHTML = html.replace(/<br\s*\/?>/gi,' ');
  return (d.textContent||'').replace(/\s+/g,' ').trim();
}
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function rootDomain(h){ const p=h.split('.'); return p.length>2 ? p.slice(-2).join('.') : h; }

/* Общая сборка новости из любого формата */
function norm(feed, o){
  let title = clean(o.title||'');
  if(!title || title.length<12) return null;
  let link = (o.link||'').trim();
  let ts = Date.parse(o.date||'');
  if(isNaN(ts)) ts = Date.now();
  if(ts > Date.now()+864e5) ts = Date.now();
  const rawDesc = o.desc || '';
  let desc = clean(rawDesc);
  if(desc.length>420) desc = desc.slice(0,420)+'…';
  if(desc && desc.toLowerCase()===title.toLowerCase()) desc = '';
  let src = o.srcName || feed.n;
  let srcHost = o.srcUrl ? host(o.srcUrl) : host(link);
  if(srcHost === 'news.google.com' || feed.u.indexOf('news.google')>-1){
    const m = rawDesc.match(/href="(https?:\/\/(?!news\.google)[^"]+)"/);
    if(m){ link = m[1]; if(!o.srcUrl) srcHost = host(link); }
    desc = '';
    const mt = title.match(/\s-\s([^-]{2,40})$/);
    if(mt && src === feed.n) src = mt[1].trim();
    title = title.replace(/\s-\s[^-]{2,40}$/,'');
  }
  return {
    id: 'i'+hash(link||title),
    title, desc, link, ts, feed:feed.n, src,
    host: srcHost || host(feed.u),
    ru: (title.match(/[A-Za-z\u0400-\u04FF]/g)||[]).length ? isRu(title) : !!feed.ru,
    ftop: feed.top || '',
    cat: categorize(title+' '+desc, feed.cat),
    tier: feed.tier || 1
  };
}

function parseFeed(xml, feed){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const nodes = [...doc.querySelectorAll('item, entry')];
  const out = [];
  for(const it of nodes){
    let link = txt(it,'link');
    if(!link){ const l = it.querySelector('link'); link = l ? l.getAttribute('href')||'' : ''; }
    const srcEl = it.getElementsByTagName('source')[0];
    const n = norm(feed, {
      title: txt(it,'title'),
      link,
      date: txt(it,'pubDate') || txt(it,'published') || txt(it,'updated') || txt(it,'date'),
      desc: tag(it,'content:encoded') || txt(it,'description') || txt(it,'summary') || txt(it,'content'),
      srcName: srcEl ? (srcEl.textContent||'').trim() : '',
      srcUrl: srcEl ? srcEl.getAttribute('url') : ''
    });
    if(n) out.push(n);
  }
  return out;
}

function parseJson(j, feed){
  const out = [];
  for(const it of (j.items||[])){
    const n = norm(feed, {
      title: it.title, link: it.link, date: it.pubDate,
      desc: it.description || it.content || ''
    });
    if(n) out.push(n);
  }
  return out;
}
function txt(el, name){ const n = el.getElementsByTagName(name)[0]; return n ? (n.textContent||'').trim() : ''; }
function tag(el, name){ const n = el.getElementsByTagName(name)[0]; return n ? (n.textContent||'') : ''; }
function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h).toString(36); }
function cyr(s){ return /[\u0400-\u04FF]/.test(s); }
/* Кириллица против латиницы: решаем по доле букв, а не по одному символу */
function isRu(s){
  const ru = (s.match(/[\u0400-\u04FF]/g)||[]).length;
  const la = (s.match(/[A-Za-z]/g)||[]).length;
  if(!ru && !la) return false;
  return ru / (ru + la) > 0.45;
}

function scoreTrust(it){
  const reasons = [];
  const d = rootDomain(it.host||'');
  let base = DOMAIN_TIER[d] || DOMAIN_TIER[it.host] || 0;
  if(!base) base = it.tier || 1;
  let sc = base===3 ? 88 : base===2 ? 74 : 56;
  reasons.push(base===3 ? 'Агентство или официальный сайт' : base===2 ? 'Профильное отраслевое СМИ' : 'Блог или агрегатор без редакции');
  if(/\.gov$|\.gov\.|europa\.eu$|cbr\.ru$/.test(it.host)){ sc = Math.max(sc,95); reasons.push('Первоисточник: официальный домен'); }

  const t = (it.title+' '+it.desc).toLowerCase();
  const rumor = RUMOR.some(w=>t.includes(w));
  if(rumor){ sc -= 26; reasons.push('В тексте есть маркеры слуха: «источники», «сообщается», «якобы»'); }
  if(OFFICIAL.some(w=>t.includes(w))){ sc += 6; reasons.push('Есть ссылка на официальное заявление или документ'); }
  if(/\?\s*$/.test(it.title)){ sc -= 5; reasons.push('Заголовок-вопрос — обычно это предположение, а не факт'); }
  if(/(price prediction|to the moon|прогноз цены|взлетит|обвал|шок)/.test(t)){ sc -= 10; reasons.push('Оценочная или кликбейтная подача'); }
  if(it.conf>1){ sc += Math.min(12, it.conf*5); reasons.push('Ту же новость дали ' + it.conf + ' независимых источника'); }

  sc = Math.max(12, Math.min(99, Math.round(sc)));
  let lvl, label;
  if(rumor && sc<80){ lvl=1; label='Инсайд · слух'; }
  else if(sc>=85){ lvl=3; label='Проверено'; }
  else if(sc>=70){ lvl=2; label='Надёжно'; }
  else if(sc>=56){ lvl=1; label='Средне'; }
  else { lvl=0; label='Не подтверждено'; }
  return {score:sc, lvl, label, reasons, rumor};
}

function impactBase(it){
  const t = it.title + ' ' + (it.desc||'');
  const asset = ASSET_RE.test(t);
  const macro = MACRO_RE.test(t);
  if(!asset && !macro) return {base:0, why:[], off:true};

  let sc = 0; const why = [];
  for(const r of IMPACT) if(r.re.test(t)){ sc += r.w; why.push(r.t); }
  if(/\b\d[\d.,\s]*\s?(million|billion|trillion|млн|млрд|трлн)\b/i.test(t)){ sc += 9; why.push('Указан крупный объём в деньгах или единицах'); }
  if(/(barrels? (per|a) day|\bbpd\b|b\/d|баррел\w* в (сутки|день)|tonnes?|метрическ\w* тонн|\btons?\b)/i.test(t)){ sc += 9; why.push('Названы физические объёмы поставок'); }
  if(/\b(record|all-time|highest|lowest|first time|unprecedented)\b|(рекорд|максимум за|минимум за|впервые)/i.test(t)){ sc += 8; why.push('Рекордное или экстремальное значение'); }
  if(/\b(breaking|urgent|just in)\b|(срочно|экстренно)/i.test(t)) sc += 6;
  for(const n of NOISE) if(n.re.test(t)) sc -= n.w;
  if(!asset && macro) sc -= 6;
  if(ASSET_RE.test(it.title)) sc += 5;
  return {base: Math.round(sc), why, off:false};
}
/* Дешёвая досборка поверх кэша: подтверждения и уровень доверия */
function impact(it){
  const b = it.impBase;
  if(!b || b.off) return {score:0, why:[], off:true};
  const sc = b.base + (it.conf>1 ? 6 : 0) + ((it.trust ? it.trust.lvl : 1) - 1) * 5;
  return {score: Math.max(0, Math.min(100, sc)), why: b.why, off:false};
}

const STOP = new Set(['после','более','этом','como','ната','that','with','from','this','have','will','says','said','amid','over','into','about','than','been','報道']);
function keyset(s){
  return new Set(s.toLowerCase().replace(/[^a-zа-яё0-9\s]/gi,' ').split(/\s+/).filter(w=>w.length>3 && !STOP.has(w)).slice(0,14));
}
function jac(a,b){ let i=0; a.forEach(x=>{ if(b.has(x)) i++; }); const u=a.size+b.size-i; return u? i/u : 0; }
function cluster(items){
  const keep = [];
  for(const it of items){ it.conf = 0; it.also = null; }
  for(const it of items){
    if(!it.ks) it.ks = keyset(it.title);
    let dup = null;
    for(let j=keep.length-1;j>=0 && j>keep.length-90;j--){
      if(jac(it.ks, keep[j].ks) >= 0.58){ dup = keep[j]; break; }
    }
    if(dup){
      dup.conf = (dup.conf||1)+1;
      dup.also = dup.also||[];
      if(dup.also.length<5 && dup.src!==it.src) dup.also.push({src:it.src, link:it.link});
      if((it.tier||1) > (dup.tier||1)){ dup.src=it.src; dup.host=it.host; dup.link=it.link; dup.tier=it.tier; }
    } else { it.conf = 1; keep.push(it); }
  }
  return keep;
}

   Шесть независимых переводчиков. Если один отказал или упёрся в лимит,
   строка тут же уходит в следующий. Отказавший отправляется в паузу,
   которая растёт с каждым сбоем, и потом снова возвращается в строй. */

/* Запрос напрямую, а если браузер не пускает — через рабочие зеркала */
async function fetchAny(url, ms){
  try { return await grab(url, ms || 8000); }
  catch(e){}
  const list = goodProxies.length ? goodProxies : [0,1,2];
  for(const i of list){
    const p = PROXY[i];
    if(!p || p.asJson || p.raw) continue;
    try{
      const r = await grab(p.f(url), (ms||8000) + 3000);
      return p.unwrap ? (JSON.parse(r)[p.unwrap] || '') : r;
    }catch(e){}
  }
  throw new Error('нет ответа');
}

const TR_BACKENDS = [

const trHealth = TR_BACKENDS.map(()=>({fail:0, until:0, ok:0}));

function backendOrder(batchOnly){
  const idx = TR_BACKENDS.map((b,i)=>i).filter(i=>!batchOnly || TR_BACKENDS[i].batch);
  return idx.sort((a,b)=>(trHealth[a].until - trHealth[b].until) || (trHealth[b].ok - trHealth[a].ok));
}
function trOk(i){ trHealth[i].fail = 0; trHealth[i].until = 0; trHealth[i].ok++; }
function trBad(i){
  const h = trHealth[i];
  h.fail++;
  h.until = Date.now() + Math.min(6, h.fail) * 20000;
}

/* Одна строка через первый живой переводчик */
async function trTry(text, batchOnly){
  for(const i of backendOrder(batchOnly)){
    if(trHealth[i].until > Date.now()) continue;
    try{
      const out = await TR_BACKENDS[i].run(text);
      if(out && out.length > 1 && out !== text){ trOk(i); return out; }
      throw new Error('пустой ответ');
    }catch(e){ trBad(i); }
  }
  // все в паузе — берём того, чья пауза кончится раньше, и пробуем через силу
  const i = backendOrder(batchOnly)[0];
  if(i != null){
    try{ const out = await TR_BACKENDS[i].run(text); if(out && out !== text){ trOk(i); return out; } }catch(e){}
  }
  return '';
}
async function gtrans(text){
  const out = await trTry(text, false);
  if(!out) throw new Error('переводчики недоступны');
  return out;
}

async function tr(text){
  if(!S.translate || !text) return text;
  if(isRu(text)) return text;
  if(trCache.has(text)) return trCache.get(text);
  const out = await trTry(text, false);
  if(!out || out.length < 2) return text;
  trCache.set(text, out);
  if(trCache.size % 24 === 0) persistTr();
  return out;
}

/* Пакетный перевод: десятки заголовков уходят одним запросом.
   Раньше на каждый шёл свой — переводчик упирался в лимит и часть новостей
   оставалась на английском. */
async function trOnce(text){
  if(trCache.has(text)) return trCache.get(text);
  const o = await trTry(text, false);
  if(o && o.length > 1){ trCache.set(text, o); return o; }
  return '';
}

let trDead = 0, trCooldown = 0;
async function trMany(list){
  const res = list.slice();
  if(!S.translate || Date.now() < trCooldown) return res;
  const todo = [];
  list.forEach((t,i)=>{
    if(!t){ res[i]=t; return; }
    if(isRu(t)){ res[i]=t; return; }
    if(trCache.has(t)){ res[i]=trCache.get(t); return; }
    todo.push(i);
  });
  if(!todo.length) return res;

  const groups = [];
  let cur = [], len = 0;
  for(const i of todo){
    const L = list[i].length;
    if(cur.length && (len+L > 700 || cur.length >= 8)){ groups.push(cur); cur=[]; len=0; }
    cur.push(i); len += L + 1;
  }
  if(cur.length) groups.push(cur);

  for(const g of groups){
    const src = g.map(i=>list[i].replace(/\n+/g,' ').trim());
    let ok = false;
    try{
      const joined = await trTry(src.join('\n'), true);
      const lines = (joined||'').split('\n').map(s=>s.trim()).filter(s=>s.length);
      if(lines.length === g.length){
        g.forEach((idx,k)=>{ res[idx] = lines[k]; trCache.set(list[idx], lines[k]); });
        ok = true;
      }
    }catch(e){}
    if(!ok){
      // пакет не сложился — гоним построчно, по четыре одновременно
      for(let z=0; z<g.length; z+=4){
        const chunk = g.slice(z, z+4);
        const outs = await Promise.all(chunk.map(idx=>trOnce(list[idx])));
        outs.forEach((o,q)=>{ if(o) res[chunk[q]] = o; });
      }
      if(g.every(idx=>res[idx] === list[idx])) trDead++; else trDead = 0;
    } else trDead = 0;
    // если подряд не идёт ничего — отходим на две минуты, а не долбим переводчик
    if(trDead >= 4){ trCooldown = Date.now() + 120000; break; }
    await new Promise(r=>setTimeout(r, 120));
  }
  persistTr();
  return res;
}
let trSaveAt = 0, trSaveTimer = null;
function persistTr(force){
  clearTimeout(trSaveTimer);
  const run = ()=>{
    trSaveAt = Date.now();
    const o = {}; let n = 0;
    for(const [k,v] of trCache){ if(n++>2000) break; o[k]=v; }
    store.set('tr', o);
  };
  // сериализация двух тысяч строк — дорогая операция, делаем её редко
  if(force || Date.now() - trSaveAt > 15000) run();
  else trSaveTimer = setTimeout(run, 15000);
}
let qActive = 0;
const qWait = [];
function queued(fn){
  return new Promise(res=>{
    const run = async () => { qActive++; try{ res(await fn()); } catch(e){ res(null); } finally { qActive--; next(); } };
    if(qActive < 4) run(); else qWait.push(run);
  });
}
function next(){ if(qWait.length && qActive<4) qWait.shift()(); }

let trBusy = false;
/* Переводим всё до последней новости: цикл идёт, пока остаётся хоть одна
   непереведённая. Раньше стоял потолок на проход, и хвост ленты оставался
   английским до следующего обновления. */
async function translateVisible(){
  if(trBusy || !S.translate) return;
  trBusy = true;
  try{
    for(let round = 0; round < 20; round++){
      if(Date.now() < trCooldown) break;
      const pending = state.items.filter(i=>!i.ru && !i.tTitle && !(i.trNext > Date.now()));
      if(!pending.length) break;

      // впереди то, что человек видит прямо сейчас
      const vis = new Set(visible().slice(0, state.limit).map(i=>i.id));
      pending.sort((a,b)=>(vis.has(b.id)?1:0) - (vis.has(a.id)?1:0) || b.ts - a.ts);

      const part = pending.slice(0, 8);
      const src = [];
      for(const it of part){ src.push(it.title); src.push(it.desc ? it.desc.slice(0,240) : ''); }
      const out = await trMany(src);
      part.forEach((it,k)=>{
        const t = out[k*2], d = out[k*2+1];
        if(t && t !== it.title){
          it.tTitle = t;
          it.tDesc = d && d !== it.desc ? d : '';
          it.trFail = 0;
        } else {
          it.trFail = (it.trFail||0) + 1;
          it.trNext = Date.now() + Math.min(6, it.trFail) * 30000;
        }
        const el = document.querySelector('[data-id="'+it.id+'"]');
        if(el && it.tTitle) paintCard(el, it);
      });
      await new Promise(r=>setTimeout(r, 60));
    }
  } finally {
    trBusy = false;
  }
}

/* Последняя лента лежит в памяти браузера: при открытии новости видны мгновенно,
   а обновление идёт фоном. Раньше пустой экран висел до конца первой загрузки. */
function saveItems(){
  try{
    const slim = state.items.slice(0, 120).map(i=>({
      id:i.id, title:i.title, desc:(i.desc||'').slice(0,200), link:i.link, ts:i.ts,
      feed:i.feed, src:i.src, host:i.host, ru:i.ru, cat:i.cat, tier:i.tier, tTitle:i.tTitle, tDesc:i.tDesc
    }));
    store.set('items', slim);
  }catch(e){}
}
function loadItems(){
  const raw = store.get('items', []);
  if(!raw.length) return;
  const cutoff = Date.now() - 3*864e5;
  const all = raw.filter(i=>i.ts > cutoff).map(attachMeta).filter(i=>i.mkt);
  for(const it of all){ it.conf = 1; it.trust = scoreTrust(it); it.imp = impact(it); }
  state.items = all;
}

/* ---------- 11. ЗАГРУЗКА ЛЕНТЫ ---------- */
const feedFail = {}, feedSkip = {};
async function loadOne(f, seed){
  state.fetched.add(f.n);
  try{
    const r = await grabFeed(f.u, seed||0);
    const items = r.json ? parseJson(r.json, f) : parseFeed(r.xml, f);
    state.health[f.n] = {ok:items.length>0, n:items.length, err: items.length?'':'пустая лента'};
    feedFail[f.n] = 0;
    return items;
  }catch(e){
    state.health[f.n] = {ok:false, n:0, err:e.message||'нет ответа'};
    // не долбимся в мёртвую ленту каждую минуту: пауза растёт с каждым отказом
    feedFail[f.n] = (feedFail[f.n]||0) + 1;
    feedSkip[f.n] = state.cycle + Math.min(8, feedFail[f.n] * 2);
    return [];
  }
}

/* Тяжёлые разборы считаются один раз на новость и лежат в кэше. */
const meta = new Map();
function attachMeta(it){
  let m = meta.get(it.id);
  if(!m){
    m = {imp: impactBase(it), top: topicsOf(it), mkt: isMarket(it), ks: keyset(it.title)};
    meta.set(it.id, m);
  }
  it.impBase = m.imp; it.top = m.top; it.mkt = m.mkt; it.ks = m.ks;
  return it;
}

/* ================= ХРАНИЛИЩЕ НОВОСТЕЙ =================
   Главное изменение движка. Раньше лента пересобиралась из того, что пришло
   в этом цикле: не ответила лента — её новости пропадали с экрана, и вкладка
   оказывалась пустой даже без единой старой новости. Теперь есть постоянное
   хранилище: новости в него только добавляются, а уходят лишь по сроку.
   Провалившийся запрос просто ничего не приносит и ничего не ломает. */
const master = new Map();

function ingest(items){
  for(const it of items){
    const ex = master.get(it.id);
    if(ex){
      // уже знаем эту новость — сохраняем перевод и отметку «новое»
      if(it.ts > ex.ts) ex.ts = it.ts;
      continue;
    }
    master.set(it.id, it);
  }
}

function rebuild(wasFirst){
  const cutoff = Date.now() - 3*864e5;
  let all = [];
  for(const it of master.values()){
    if(it.ts <= cutoff) continue;
    attachMeta(it);
    if(!it.mkt) continue;
    all.push(it);
  }
  all.sort((a,b)=>b.ts-a.ts);
  if(all.length > 700) all = all.slice(0, 700);

  // чистим хранилище только по факту переполнения, а не после каждой загрузки
  if(master.size > 1400){
    const keep = new Set(all.map(i=>i.id));
    for(const k of master.keys()) if(!keep.has(k)) master.delete(k);
  }

  const list = cluster(all);
  for(const it of list){ it.trust = scoreTrust(it); it.imp = impact(it); }

  let fresh = 0;
  if(!wasFirst && state.prevIds){
    for(const it of list){
      if(!state.prevIds.has(it.id) && !it.newAt){ it.newAt = Date.now(); fresh++; }
    }
  }
  state.items = list;
  render();
  updateStamp();
  translateVisible();
  return fresh;
}

/* Сохраняем ленту в память браузера. Пустой результат её больше не затирает. */
function saveItems(){
  if(state.items.length < 5) return;
  try{
    const slim = state.items.slice(0, 200).map(i=>({
      id:i.id, title:i.title, desc:(i.desc||'').slice(0,180), link:i.link, ts:i.ts,
      feed:i.feed, src:i.src, host:i.host, ru:i.ru, cat:i.cat, tier:i.tier, tTitle:i.tTitle, tDesc:i.tDesc
    }));
    store.set('items', slim);
  }catch(e){}
}
function loadItems(){
  const raw = store.get('items', []);
  if(!raw.length) return;
  const cutoff = Date.now() - 3*864e5;
  for(const i of raw) if(i.ts > cutoff){ i.conf = 1; master.set(i.id, i); }
  rebuild(true);
}

/* ================= ЗАГРУЗЧИК =================
   Опрашиваем не все ленты разом, а быстрые каждый цикл плюс треть остальных.
   Так на бесплатные зеркала приходится втрое меньше запросов, они перестают
   отбивать нас лимитом, а лента всё равно полная — новости-то накапливаются. */
const FAST = new Set(['Срочно · рынки','ForkLog','Bits.media','РБК Экономика','РБК Крипто','ПРАЙМ','CoinDesk','OilPrice','Нефть RU','Крипта RU','Bing · нефть','Yahoo · oil']);

function feedsForCycle(){
  const on = FEEDS.filter(f=>!S.off[f.n] && !(feedSkip[f.n] > state.cycle));
  const fast = on.filter(f=>FAST.has(f.n));
  const rest = on.filter(f=>!FAST.has(f.n));
  if(state.firstRun) return on;                       // при первом запуске берём всё
  const part = rest.filter((f,i)=> i % 4 === state.cycle % 4);
  return fast.concat(part);
}

async function loadAll(manual){
  if(state.loading) return;
  state.loading = true;
  state.cycle = (state.cycle||0) + 1;
  const wasFirst = state.firstRun;
  state.prevIds = new Set(state.items.map(i=>i.id));
  state.fetched = new Set();
  const active = manual ? FEEDS.filter(f=>!S.off[f.n]) : feedsForCycle();
  let fresh = 0, okCount = 0, lastPaint = 0;
  updateStamp();

  try{
    await Promise.all(active.map(async (f, k) => {
      const items = await loadOne(f, k);
      if(items.length){
        okCount++;
        ingest(items);
        const now = Date.now();
        if(now - lastPaint > 600){ lastPaint = now; try{ fresh = rebuild(wasFirst); }catch(e){} }
      }
    }));
    try{ fresh = rebuild(wasFirst); }catch(e){ console.warn('rebuild', e); }

    // если почти все ленты отвалились, зеркала могли умереть — переспрашиваем
    if(active.length > 4 && okCount / active.length < 0.3){
      await pickProxy();
      const retry = active.filter(f=>!state.health[f.n] || !state.health[f.n].ok).slice(0, 10);
      const more = await Promise.all(retry.map((f,k)=>loadOne(f,k)));
      let got = 0;
      for(const arr of more){ if(arr.length){ got++; ingest(arr); } }
      if(got){ okCount += got; try{ fresh = rebuild(wasFirst); }catch(e){} }
    }
  } catch(e){
    console.warn('load', e);
  } finally {
    state.firstRun = false;
    state.loading = false;
    state.okCount = Object.values(state.health).filter(h=>h.ok).length;
    if(okCount > 0) state.lastOk = Date.now();
    if(fresh > 0 && !wasFirst && !manual && window.scrollY > 200){ state.pendingNew += fresh; showNewbar(); }
    render();
    updateStamp();
    saveItems();
    // ничего не пришло — не ждём полторы минуты, пробуем снова через 5, 12 и 25 секунд
    if(!state.items.length){
      state.retry = (state.retry || 0) + 1;
      if(state.retry <= 3) setTimeout(()=>loadAll(true), [5000, 12000, 25000][state.retry-1]);
      else if(state.retry === 4) autoDiag();
    } else state.retry = 0;
  }
}

/* Если после нескольких попыток пусто — сами показываем, где обрыв */

/* ---------- 12. ОТРИСОВКА ЛЕНТЫ ---------- */
function visible(){
  let r = state.items.filter(i=>i.mkt);      // только рыночные новости
  const f = state.filter;

  if(f === 't:world'){
    // всё, что не про США, Иран, Китай и Японию
    r = r.filter(i=>{
      const t = (i.top||'').split(' ');
      return !t.includes('usa') && !t.includes('iran') && !t.includes('china') && !t.includes('japan');
    });
  } else if(f.indexOf('t:') === 0){
    const k = f.slice(2);
    r = r.filter(i=>(i.top||'').split(' ').includes(k));
  }

  if(S.onlyBig) r = r.filter(i=>i.imp && !i.imp.off && i.imp.score >= S.minImpact);
  if(S.onlyTrusted) r = r.filter(i=>i.trust.lvl>=2);
  if(state.q){
    const q = state.q.toLowerCase();
    r = r.filter(i=>((i.tTitle||'')+' '+i.title+' '+i.src).toLowerCase().includes(q));
  }
  return r;
}

function ago(ts){
  const s = Math.max(1, Math.round((Date.now()-ts)/1000));
  if(s<60) return 'только что';
  const m = Math.round(s/60);
  if(m<60) return m+' мин';
  const h = Math.round(m/60);
  if(h<24) return h+' ч';
  const d = Math.round(h/24);
  return d+' дн';
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Новость считается новой 5 минут с момента появления в ленте */
const NEW_FOR = 5*60*1000;
function isFresh(it){ return !!it.newAt && !it.seen && (Date.now()-it.newAt) < NEW_FOR; }

function paintCard(el, it){

  const title = it.ru ? it.title : (it.tTitle || it.title);
  const sum = it.ru ? it.desc : (it.tDesc || '');

  const tp = topicLabels(it).slice(0,3);
  const nw = isFresh(it);
  const il = it.imp ? impLabel(it.imp.score) : '';
  el.className = 'card' + (nw ? ' isnew' : '');
  el.dataset.v = (it.tTitle?'t':'-') + (it.conf||1) + (nw?'n':'-');
  el.setAttribute('data-cat', it.cat||'');
  el.innerHTML =
    '<div class="spine"></div><div class="cbody">'+

      (il ? '<span class="ip '+(il==='СИЛЬНОЕ'?'ip3':'ip2')+'">⚡ '+il+'</span>' : '')+
      '<span class="src">'+esc(it.src)+'</span><span>·</span><span class="ago">'+ago(it.ts)+'</span>'+
      '<span class="trust t'+t.lvl+'"><b></b>'+t.label+' '+t.score+'</span>'+
      (it.conf>1 ? '<span class="conf">✓ '+it.conf+' источника</span>' : '')+
    '</div>'+
    '<h3 class="ttl">'+esc(title)+'</h3>'+
    (!it.ru && S.showOrig && it.tTitle ? '<p class="orig">'+esc(it.title)+'</p>' : '')+
    (sum ? '<p class="sum">'+esc(sum)+'</p>' : '')+
    (tg.length||tp.length ? '<div class="tags">'+
       tp.map(x=>'<span class="tag tp">'+esc(x)+'</span>').join('')+
       tg.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div>' : '')+
    '<div class="acts">'+
      '<button class="act" data-act="read">Читать полностью</button>'+
      '<button class="act ghost" data-act="why">Почему такая оценка</button>'+
    '</div></div>';
}

/* Обновляем карточку, только если реально что-то изменилось */
function touchCard(el, it){
  const v = (it.tTitle?'t':'-') + (it.conf||1) + (isFresh(it)?'n':'-');
  if(el.dataset.v !== v){ paintCard(el, it); return; }
  const a = el.querySelector('.ago');
  if(a) a.textContent = ago(it.ts);
}

function render(){
  if(state.tab!=='news') return;
  const feed = $('#feed');
  const list = visible();
  const slice = list.slice(0, state.limit);

  if(!slice.length){
    let html;
    if(state.loading || state.booting){
      html = '<div class="empty"><b>Подключаюсь…</b>Собираю новости из '+FEEDS.length+' источников по трём поисковым системам.'+
        '<div id="diagBox" style="text-align:left;margin-top:14px"></div></div>';
    } else if(!state.items.length){
      html = '<div class="empty"><b>Новости не загрузились</b>'+
        'Ни один из '+FEEDS.length+' источников не ответил. Ниже видно, где именно обрыв.'+
        '<div style="margin-top:16px"><button class="act" id="diagBtn">Проверить связь</button></div>'+
        '<div id="diagBox" style="text-align:left;margin-top:14px"></div></div>';
    } else {
      html = '<div class="empty"><b>По этому фильтру пусто</b>Смени фильтр вверху или очисти поиск.</div>';
    }
    feed.innerHTML = html;
    feed.dataset.mode = 'empty';
    const db = $('#diagBtn');
    if(db) db.onclick = ()=>runDiag($('#diagBox'));
    $('#moreBtn').hidden = true;
    return;
  }

  if(feed.dataset.mode !== 'feed'){ feed.innerHTML = ''; feed.dataset.mode = 'feed'; }

  // где стоит человек и какой сейчас рост страницы — чтобы не дёрнуть прокрутку
  const atTop = window.scrollY < 120;
  const hBefore = document.documentElement.scrollHeight;

  const have = new Map();
  for(const c of feed.children) if(c.dataset.id) have.set(c.dataset.id, c);

  let prev = null, added = 0;
  for(const it of slice){
    let el = have.get(it.id);
    if(el){ have.delete(it.id); touchCard(el, it); }
    else {
      el = document.createElement('article');
      el.dataset.id = it.id;
      paintCard(el, it);
      if(isFresh(it)) el.classList.add('enter');
      added++;
    }
    const ref = prev ? prev.nextSibling : feed.firstChild;
    if(ref !== el) feed.insertBefore(el, ref);
    prev = el;
  }
  have.forEach(el=>el.remove());

  // если человек читает ниже — сдвигаем прокрутку на высоту приехавших новостей
  if(!atTop && added){
    const d = document.documentElement.scrollHeight - hBefore;
    if(d > 0) window.scrollBy(0, d);
  }
  $('#moreBtn').hidden = list.length <= state.limit;
}

/* ---------- 13. СТАТЬЯ ---------- */
function byId(id){ return state.items.find(i=>i.id===id); }

/* Приводим число к читаемому виду: 3,412.50 -> 3 412,50 */
function ruNum(s){
  const m = s.match(/^([^\d+-]*)([+-]?)([\d.,\s]+)(.*)$/);
  if(!m) return s;
  let [ ,pre, sign, num, post] = m;
  num = num.replace(/\s/g,'');
  let int = num, frac = '';
  const dot = num.lastIndexOf('.'), com = num.lastIndexOf(',');
  const sep = Math.max(dot, com);
  if(sep > -1 && num.length - sep <= 3 && /[.,]/.test(num[sep])){
    int = num.slice(0, sep); frac = num.slice(sep+1);
  }
  int = int.replace(/[.,]/g,'');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
  return pre + sign + int + (frac ? ','+frac : '') + post;
}

const FIG_KEY = [

  [/(bitcoin|btc|биткоин)/i, 'BTC'],
  [/(ether|ethereum|eth\b|эфир)/i, 'ETH'],
  [/(inflation|cpi|инфляц)/i, 'Инфляция'],
  [/(rate|basis points|ставк|б\.п)/i, 'Ставка'],
  [/(yield|treasury|доходност)/i, 'Доходность'],
  [/(ounce|унци)/i, 'За унцию'],

  [/(inflow|outflow|fund|etf|приток|отток)/i, 'Потоки в фонды']
];
const UP = /\b(rose|rise|risen|gain|gained|jump|jumped|surge|surged|climb|climbed|up|higher|rally|rallied)\b|(вырос|подорожал|прибав|подскочил|укрепил|рост)/i;
const DOWN = /\b(fell|fall|fallen|drop|dropped|decline|declined|slid|slump|slumped|down|lower|sank)\b|(упал|подешевел|снизил|обвал|просел|сократ)/i;

function figures(text){
  // число может содержать пробел как разделитель разрядов: $4 580 рвалось на «$4»
  const NUM = '\\d{1,3}(?:[ \\u00A0\\u2009.,]\\d{3})*(?:[.,]\\d{1,2})?';
  const re = new RegExp(
    '(?:[$\u20ac\u00a3\u20bd\u00a5]\\s?' + NUM + '(?:\\s?(?:billion|million|trillion|bn|mn|\u043c\u043b\u0440\u0434|\u043c\u043b\u043d|\u0442\u0440\u043b\u043d))?' +
    '|[+-]?' + NUM + '\\s?%' +
    '|' + NUM + '\\s?(?:basis points|bps|\u0431\\.\u043f\\.)' +
    '|' + NUM + '\\s?(?:barrels|bbl|\u0431\u0430\u0440\u0440\u0435\u043b\\w*|tonnes|tons|\u0442\u043e\u043d\u043d\\w*|ounces|\u0443\u043d\u0446\u0438\\w*))', 'gi');
  const out = [], seen = new Set();
  let m;
  while((m = re.exec(text)) !== null && out.length < 40){
    const val = m[0].trim();
    const digits = (val.match(/\d/g)||[]).length;
    const before = text.slice(Math.max(0, m.index-55), m.index);
    const after  = text.slice(m.index + val.length, m.index + val.length + 40);
    const around = before + val + after;
    let label = '';
    for(const [rx, name] of FIG_KEY){ if(rx.test(before)){ label = name; break; } }
    if(!label) for(const [rx, name] of FIG_KEY){ if(rx.test(after)){ label = name; break; } }
    // без понятной привязки берём только крупные суммы, обрывки вроде «$4» пропускаем
    if(!label){
      if(val.indexOf('%') > -1 || digits < 3) continue;
      label = '\u0426\u0435\u043d\u0430 \u0432 \u0442\u0435\u043a\u0441\u0442\u0435';
    }
    const key = label + '|' + val;
    if(seen.has(key)) continue;
    seen.add(key);
    let dir = 0;
    if(/^\+/.test(val) || UP.test(around)) dir = 1;
    if(/^-/.test(val) || DOWN.test(around)) dir = -1;
    out.push({label, val: ruNum(val), dir});
  }
  const byLabel = new Map();
  for(const f of out) if(!byLabel.has(f.label)) byLabel.set(f.label, f);
  return [...byLabel.values()].slice(0, 8);
}

/* Достаём текст статьи: сначала читалка, потом сама страница через зеркало */
async function fetchArticle(link){
  let best = '', bestN = 0;
  const keep = t => { const n = articleParas(t).length; if(n > bestN){ best = t; bestN = n; } };
  try{
    const t = tidy(await grab('https://r.jina.ai/' + link, 16000));
    keep(t);
    if(bestN >= 3) return best;
  }catch(e){}
  for(const p of PROXY){
    if(p.asJson || p.raw) continue;
    try{
      let html = await grab(p.f(link), 11000);
      if(p.unwrap) html = JSON.parse(html)[p.unwrap] || '';
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script,style,nav,header,footer,aside,form,noscript,figure').forEach(n=>n.remove());
      const root = doc.querySelector('article') || doc.querySelector('main') || doc.body;
      if(!root) continue;
      const ps = [...root.querySelectorAll('p')].map(n=>(n.textContent||'').trim()).filter(x=>x.length>40);
      keep(ps.join('\n\n'));
      if(bestN >= 3) return best;
    }catch(e){}
  }
  return best;
}

function assetLinks(it, text){
  const t = it.title + ' ' + (it.desc||'') + ' ' + (text||'').slice(0,1800);
  const out = [], seen = new Set();
  for(const L of LINKS){
    if(!L.re.test(t)) continue;
    for(const h of L.hits){
      const key = h[0] + '|' + h[2].slice(0,25);
      if(seen.has(key)) continue;
      seen.add(key);
      out.push({asset:h[0], dir:h[1], text:h[2]});
    }
  }
  return out.slice(0, 6);
}

function tidy(md){
  let t = md
    .replace(/^Title:.*$/m,'')
    .replace(/^URL Source:.*$/m,'')
    .replace(/^Published Time:.*$/m,'')
    .replace(/^Markdown Content:/m,'')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,' ')       // картинки
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')     // ссылки, включая пустые [](…)
    .replace(/<[^>]+>/g,' ')                    // остатки разметки
    .replace(/https?:\/\/\S+/g,' ')             // голые адреса
    .replace(/\[\s*\]|\(\s*\)/g,' ')            // пустые скобки после чистки
    .replace(/^[-\s|:=_*]+$/gm,'')
    .replace(/[*#>`]/g,'');
  t = t.split('\n').map(line=>{
    const s = line.trim();
    if(s.startsWith('|')){
      const cells = s.split('|').map(c=>c.trim()).filter(Boolean);
      return cells.length ? '• ' + cells.join('  —  ') : '';
    }
    return s;
  }).join('\n');
  return t.replace(/[ \t\u00A0]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}

/* Мусор, который читалка тащит вместе со статьёй */
const JUNK = /(toggle navigation|запомнить|войти|регистрац|подпис\w+ на|рассылк|cookie|все права защищены|при использовании материалов|читайте также|поделиться|реклама|©|тел[:.]|ул\.\s|адрес:|follow us|subscribe|newsletter|sign in|log in|advertisement|privacy policy|terms of|наверх|меню|рубрик)/i;
const MONTHS_RE = /\d{1,2}\s+(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)/gi;

function isProse(s){
  if(s.length < 60) return false;
  if(JUNK.test(s)) return false;
  if(!/[.!?…]/.test(s)) return false;                    // без единого знака конца — это меню
  if(s.split(/\s+/).length < 10) return false;
  if((s.match(/\d/g)||[]).length / s.length > 0.22) return false;   // календари и списки цифр
  if((s.match(MONTHS_RE)||[]).length > 1) return false;             // лента чужих заголовков
  if((s.match(/[•|]/g)||[]).length > 3) return false;
  const caps = (s.match(/\s[А-ЯA-Z][а-яa-z]+/g)||[]).length;
  if(caps > s.split(/\s+/).length * 0.5) return false;              // список разделов сайта
  return true;
}

/* Оставляем только связный текст статьи */
function articleParas(text){
  let raw = text.split(/\n{2,}/).map(s=>s.replace(/\n/g,' ').trim()).filter(Boolean);
  if(raw.length < 3 && text.length > 1500) raw = text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const good = raw.filter(isProse);
  if(good.length >= 1) return good.slice(0, 30);
  // если статья короткая или структура необычная — берём мягче, но мусор всё равно режем
  return raw.filter(s => s.length > 40 && !JUNK.test(s) && (s.match(/\d/g)||[]).length / s.length < 0.3).slice(0, 30);
}

/* ---------- 15. КАЛЕНДАРЬ ---------- */
function usDST(y,mo,d){ // 2-е вс марта — 1-е вс ноября
  const t = Date.UTC(y,mo-1,d);
  const mar = nth(y,3,0,2), nov = nth(y,11,0,1);
  return t >= Date.UTC(y,2,mar) && t < Date.UTC(y,10,nov);
}
function euDST(y,mo,d){ // последнее вс марта — последнее вс октября
  const t = Date.UTC(y,mo-1,d);
  return t >= Date.UTC(y,2,last(y,3,0)) && t < Date.UTC(y,9,last(y,10,0));
}
function nth(y,m,wd,n){ // n-й день недели wd (0=вс) месяца m(1-12)
  const first = new Date(Date.UTC(y,m-1,1)).getUTCDay();
  return 1 + ((wd-first+7)%7) + (n-1)*7;
}
function last(y,m,wd){
  const dim = new Date(Date.UTC(y,m,0)).getUTCDate();
  const lastDay = new Date(Date.UTC(y,m-1,dim)).getUTCDay();
  return dim - ((lastDay-wd+7)%7);
}
function ET(y,m,d,h,mi){ return new Date(Date.UTC(y,m-1,d, h+(usDST(y,m,d)?4:5), mi||0)); }
function CET(y,m,d,h,mi){ return new Date(Date.UTC(y,m-1,d, h-(euDST(y,m,d)?2:1), mi||0)); }
function UTCt(y,m,d,h,mi){ return new Date(Date.UTC(y,m-1,d,h,mi||0)); }

/* Свои события — добавляй сюда: {d:[год,месяц,день], f:UTCt, h:часUTC, m:минуты, t:'Название', s:'Описание', imp:1..3, c:'macro'} */
const MY_EVENTS = [];

function buildCalendar(){
  const out = [];
  const from = Date.now() - 36e5*20;
  const to = Date.now() + 864e5*120;

  for(const e of FIXED.concat(MY_EVENTS)){
    const dt = e.f(e.d[0], e.d[1], e.d[2], e.h, e.m||0);
    out.push({t:dt, title:e.t, sub:e.s, imp:e.imp, cat:e.c, est:false});
  }

  // повторяющиеся
  const cur = new Date(from);
  cur.setUTCHours(0,0,0,0);
  for(let i=0;i<130;i++){
    const y = cur.getUTCFullYear(), m = cur.getUTCMonth()+1, d = cur.getUTCDate(), wd = cur.getUTCDay();
    const dim = new Date(Date.UTC(y,m,0)).getUTCDate();

    if(wd===5 && d<=7) out.push({t:ET(y,m,d,8,30), title:'Рынок труда США, Non-Farm Payrolls', sub:'Занятость и безработица за прошлый месяц. Двигает доллар, золото и ожидания по ставке.', imp:3, cat:'macro'});
    if(wd===4) out.push({t:ET(y,m,d,8,30), title:'Заявки на пособие по безработице', sub:'Недельные данные, быстрый срез рынка труда США.', imp:1, cat:'macro'});
    if(wd===3) out.push({t:ET(y,m,d,10,30), title:'Запасы нефти в США, EIA', sub:'Официальная статистика запасов и добычи. На праздничных неделях сдвигается на четверг.', imp:2, cat:'oil'});
    if(wd===2) out.push({t:ET(y,m,d,16,30), title:'Запасы нефти, оценка API', sub:'Отраслевая оценка накануне данных EIA.', imp:1, cat:'oil'});
    if(wd===5) out.push({t:ET(y,m,d,13,0), title:'Буровые установки, Baker Hughes', sub:'Число активных буровых в США — сигнал по будущей добыче.', imp:1, cat:'oil'});
    if(wd===5) out.push({t:ET(y,m,d,15,30), title:'Позиции фондов, отчёт CFTC', sub:'Кто и как стоит в нефти, золоте и валютах.', imp:1, cat:'macro'});
    if(wd===0 && d<=7) out.push({t:UTCt(y,m,d,11,0), title:'Заседание ОПЕК+ (ориентировочно)', sub:'Ежемесячная встреча по квотам добычи. Точную дату подтверждает секретариат ОПЕК.', imp:3, cat:'oil', est:true});
    if(wd===5 && d>dim-7) out.push({t:UTCt(y,m,d,8,0), title:'Экспирация опционов на BTC и ETH', sub:'Месячная экспирация на Deribit. Часто дёргает цену вокруг крупных страйков.', imp:2, cat:'crypto'});
    // PCE — ориентировочно последний рабочий день месяца
    if(d>dim-3 && wd>0 && wd<6 && !(d<dim-2)) {
      const isLastBiz = (()=>{ for(let k=d+1;k<=dim;k++){ const w=new Date(Date.UTC(y,m-1,k)).getUTCDay(); if(w>0&&w<6) return false; } return true; })();
      if(isLastBiz) out.push({t:ET(y,m,d,8,30), title:'Инфляция PCE — любимый индикатор ФРС', sub:'Расходы американцев и базовая инфляция. Дата ориентировочная, сверяй с BEA.', imp:3, cat:'macro', est:true});
    }
    cur.setUTCDate(cur.getUTCDate()+1);
  }

  return out.filter(e=>e.t.getTime()>=from && e.t.getTime()<=to).sort((a,b)=>a.t-b.t);
}

const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WDN = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

function renderCal(){
  const box = $('#viewCal');
  const evs = buildCalendar();
  const now = Date.now();
  const nx = evs.find(e=>e.imp===3 && e.t.getTime()>now) || evs.find(e=>e.t.getTime()>now);
  let html = '';
  if(nx){
    html += '<div class="next"><div class="lbl">Ближайшее важное</div><h3>'+esc(nx.title)+'</h3>'+
      '<div class="when">'+fmtWhen(nx.t)+'</div><div class="cd" id="cd">—</div></div>';
  }
  let day = '';
  for(const e of evs){
    const dkey = e.t.toDateString();
    if(dkey !== day){
      day = dkey;
      const isToday = dkey === new Date().toDateString();
      html += '<div class="daygrp"><div class="dayhd'+(isToday?' today':'')+'"><b>'+
        (isToday?'Сегодня, ':'')+e.t.getDate()+' '+MON[e.t.getMonth()]+'</b><span>'+WDN[e.t.getDay()]+'</span></div>';
    }
    const past = e.t.getTime() < now;
    html += '<div class="ev'+(past?' past':'')+'"><div class="tm">'+
      e.t.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div>'+
      '<div class="en"><b>'+esc(e.title)+(e.est?'<span class="est">≈</span>':'')+'</b><p>'+esc(e.sub)+'</p></div>'+
      '<div class="imp i'+e.imp+'"><i></i><i></i><i></i></div></div>';
  }
  html += '</div><div class="foot">Время указано по часам твоего устройства. Даты ФРС, ЕЦБ и инфляции США — из официальных календарей. Значок ≈ означает, что дата ориентировочная и может сдвинуться.</div>';
  box.innerHTML = html;
  tickCountdown(nx);
}
function fmtWhen(d){
  return d.getDate()+' '+MON[d.getMonth()]+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
let cdTimer = null;
function tickCountdown(nx){
  clearInterval(cdTimer);
  if(!nx) return;
  const upd = ()=>{
    const el = $('#cd'); if(!el) return clearInterval(cdTimer);
    let s = Math.max(0, Math.floor((nx.t.getTime()-Date.now())/1000));
    const d = Math.floor(s/86400); s-=d*86400;
    const h = Math.floor(s/3600); s-=h*3600;
    const m = Math.floor(s/60); s-=m*60;
    el.textContent = (d?d+'д ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  };
  upd(); cdTimer = setInterval(upd, 1000);
}

  const b = $('#newbar');
  b.textContent = state.pendingNew + ' ' + plural(state.pendingNew,'новая новость','новые новости','новых новостей');
  b.classList.add('on');
}
function plural(n,a,b,c){ const m=n%100, k=n%10; return m>10&&m<20?c : k===1?a : k>1&&k<5?b : c; }

let timer=null;
function startTimer(){ clearInterval(timer); timer = setInterval(()=>loadAll(false), S.interval*1000); }

/* Обработчики */
document.addEventListener('click', e=>{
  const cl = e.target.closest('[data-close]');
  if(cl){ $('#'+cl.dataset.close).classList.remove('on'); document.body.style.overflow=''; return; }
  const act = e.target.closest('[data-act]');
  if(act){
    const card = act.closest('[data-id]');
    const it = byId(card.dataset.id);
    if(!it) return;
    it.seen = true;
    if(act.dataset.act==='read') openArticle(it); else showWhy(it);
  }
});
$('#tabNews').onclick = ()=>setTab('news');
$('#tabCal').onclick  = ()=>setTab('cal');
$('#tabSet').onclick  = ()=>{ renderSet(); $('#setSheet').classList.add('on'); document.body.style.overflow='hidden'; };
$('#btnRefresh').onclick = e => {
  const svg = e.currentTarget.querySelector('svg'); svg.classList.add('spin');
  state.pendingNew=0; $('#newbar').classList.remove('on');
  loadAll(true).finally(()=>setTimeout(()=>svg.classList.remove('spin'),500));
};
$('#btnSearch').onclick = ()=>{
  const s = $('#searchBox'); s.classList.toggle('on');
  if(s.classList.contains('on')) $('#q').focus(); else { $('#q').value=''; state.q=''; render(); }
};
$('#q').oninput = e => { state.q = e.target.value.trim(); state.limit=50; render(); translateVisible(); };
$('#moreBtn').onclick = ()=>{ state.limit += 50; render(); translateVisible(); };
$('#newbar').onclick = ()=>{ state.pendingNew=0; $('#newbar').classList.remove('on'); state.limit=50; render(); window.scrollTo({top:0,behavior:'smooth'}); };
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && Date.now()-state.lastOk > 45000) loadAll(false);
});
window.addEventListener('beforeunload', ()=>persistTr(true));

const APP_VER = 'v30 · 29.08';

/* Старт. Если что-то падает — сообщаем на экране, а не молча */
function boot(){
const vEl = document.getElementById('ver'); if(vEl) vEl.textContent = APP_VER;
if(window.self !== window.top || location.protocol === 'file:'){
  const w = document.createElement('div');
  w.style.cssText = 'margin-top:12px;padding:13px 14px;border:1px solid #E5A93D;border-radius:12px;background:rgba(229,169,61,.1);font-size:13.5px;line-height:1.5;color:#E5A93D';
  w.textContent = window.self !== window.top
    ? 'Страница открыта во встроенном окне. В таком режиме браузер блокирует загрузку новостей — открой её отдельной вкладкой или залей на GitHub Pages.'
    : 'Файл открыт прямо с диска. Браузер не пустит запросы к источникам — залей index.html на GitHub Pages и открой по адресу сайта.';
  document.querySelector('.wrap').prepend(w);
}
$('#foot').innerHTML = 'Новости собираются напрямую из открытых источников и переводятся машинно. Оценка доверия — автоматическая подсказка. Не инвестиционная рекомендация.';
buildChips();
try { loadItems(); } catch(e){}
render();
updateStamp();
state.booting = true; updateStamp();    // «подключаюсь…» с первой секунды
loadAll(true).finally(()=>{ state.booting = false; updateStamp(); });
pickProxy();                            // зеркала проверяем параллельно, не задерживая старт
startTimer();
setInterval(updateStamp, 20000);
setInterval(()=>{ if(state.tab==='news') render(); }, 30000);
setInterval(()=>translateVisible(), 12000);
setInterval(()=>{ if(!state.loading) pickProxy(); }, 600000);
}
try { boot(); }
catch(e){
  const d = document.getElementById('crash');
  if(d) d.innerHTML = '<div style="margin:14px;padding:14px;border:1px solid #E8603C;border-radius:12px;background:rgba(232,96,60,.12);color:#E8603C;font:14px/1.5 -apple-system,sans-serif"><b>Сбой при запуске</b><br>'+String(e.message||e).replace(/[<>]/g,'')+'</div>';
}

</script>
</body>
</html>
