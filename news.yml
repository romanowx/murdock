# Сервер новостей для сайта 222.
# Раз в пять минут GitHub сам собирает все ленты, переводит их на русский
# и публикует сайт вместе с готовым файлом news.json.
# Этот же процесс публикует сайт при каждой правке файлов в репозитории.

name: Сайт и новости

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Взять файлы сайта
        uses: actions/checkout@v4

      - name: Подготовить Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Собрать и перевести новости
        env:
          SITE_URL: https://romanowx.github.io/murdock/
        run: |
          cat > /tmp/fetch-news.mjs <<'SCRIPT_END'
