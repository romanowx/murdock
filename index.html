<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MURDOCK">
<meta name="theme-color" content="#0A0B0D">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MURDOCK — терминал трейдера</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%230A0B0D'/><text x='32' y='45' font-size='40' font-family='monospace' fill='%23E8A33D' text-anchor='middle'>M</text></svg>">
<style>
:root{
  --bg:#0A0B0D; --panel:#12141A; --panel2:#181B22; --panel3:#20242D;
  --line:#22262E; --line2:#2C313B;
  --amber:#E8A33D; --amber-dim:#7A5A22;
  --txt:#E4E7EC; --dim:#8B929C; --dim2:#616872;
  --up:#1FBF75; --dn:#EF4A44; --blue:#4C93E0; --violet:#9B7BE0;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt)}
body{font-family:var(--mono);font-size:13px;line-height:1.4;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}
:focus-visible{outline:1px solid var(--amber);outline-offset:1px}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-top:var(--safe-t);flex:0 0 auto}
.hbar{display:flex;align-items:center;gap:10px;padding:6px 12px 5px}
.brand{font-weight:700;letter-spacing:.24em;color:var(--amber);font-size:14px}
.cursor{display:inline-block;width:7px;height:12px;background:var(--amber);vertical-align:-1px;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hspace{flex:1}
.build{font-size:9px;color:var(--dim2);letter-spacing:.1em;border:1px solid var(--line2);padding:1px 4px;border-radius:2px}
.build.srv{color:var(--amber);border-color:var(--amber-dim)}
.nsub{font-family:var(--sans);font-size:11.5px;color:var(--dim);line-height:1.4;margin:-2px 0 6px}
.hstat{font-size:9.5px;color:var(--dim);letter-spacing:.05em}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--up);margin-right:4px}
.dot.warn{background:var(--amber)} .dot.bad{background:var(--dn)}
.iconbtn{background:none;border:1px solid var(--line2);border-radius:2px;color:var(--dim);padding:3px 7px;font-size:12px}
.iconbtn:active{background:var(--panel3)}
.tape{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tape::-webkit-scrollbar{display:none}
.tape-i{flex:0 0 auto;padding:3.5px 10px;border-right:1px solid var(--line);font-size:10.5px;white-space:nowrap}
.tape-i b{font-weight:600;color:var(--dim);margin-right:5px;letter-spacing:.06em}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{display:none;padding-bottom:20px}
.page.on{display:block}
nav{flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:0;padding:7px 2px 6px;color:var(--dim2);font-size:9px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .gl{font-size:14px;line-height:1}
nav button.on{color:var(--amber);box-shadow:inset 0 2px 0 var(--amber)}

/* общие */
.sec-h{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.grp{padding:4px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:9px;letter-spacing:.18em;color:var(--dim2)}
.pad{padding:12px}
.foot{padding:12px;font-size:10px;line-height:1.5;color:var(--dim2);border-top:1px solid var(--line)}
.muted{color:var(--dim)} .dim2{color:var(--dim2)}
.up{color:var(--up)} .dn{color:var(--dn)} .am{color:var(--amber)}
.small{font-size:11px} .xs{font-size:10px}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between} .wrap{flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim);font-size:11px}
.kv .v{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--line2);border-radius:2px;font-size:10.5px;color:var(--dim);background:var(--panel2)}
.chip.xs{font-size:9.5px;padding:2px 6px}
.chip.on{border-color:var(--amber);color:var(--amber);background:rgba(232,163,61,.09)}
.chip.up{border-color:rgba(31,191,117,.5);color:var(--up)}
.chip.dn{border-color:rgba(239,74,68,.5);color:var(--dn)}
.chip.vio{color:var(--violet);border-color:rgba(155,123,224,.5)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:2px;padding:9px 12px;color:var(--txt);font-size:12px;letter-spacing:.05em}
.btn:active{background:var(--panel3)}
.btn.pri{border-color:var(--amber-dim);color:var(--amber);background:rgba(232,163,61,.07)}
.btn.danger{color:var(--dn);border-color:rgba(239,74,68,.5)}
.btn.wide{width:100%}
.btn.sm{padding:4px 8px;font-size:10.5px}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:2px;padding:8px 9px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber-dim)}
label{display:block;font-size:9.5px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px}
.field{margin-bottom:9px}
.chkline{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);text-transform:none;letter-spacing:0}
.chkline input{width:auto}
.loading{padding:24px 12px;text-align:center;color:var(--dim2);font-size:10.5px;letter-spacing:.18em}
.err{padding:12px;color:var(--dn);font-size:11.5px;line-height:1.5;border-left:2px solid var(--dn);background:rgba(239,74,68,.05);margin:10px 12px}
.note{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:#BFC4CB}
.note b{color:var(--txt);font-weight:600}
ul.li{margin:0;padding-left:16px;font-family:var(--sans);font-size:12.5px;line-height:1.5;color:#BFC4CB}
ul.li li{margin-bottom:6px}

/* рынок */
.filters{display:flex;gap:5px;overflow-x:auto;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto}
.searchbar{padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.searchbar input{padding:6px 9px;font-size:12px}
.thead{display:grid;grid-template-columns:1fr 86px 68px;gap:8px;padding:4px 12px;font-size:9px;letter-spacing:.14em;color:var(--dim2);border-bottom:1px solid var(--line2);background:var(--bg);position:sticky;top:0;z-index:5}
.thead .r{text-align:right}
.thead span{white-space:nowrap}
.mrow{display:grid;grid-template-columns:1fr 86px 68px;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.mrow:active{background:var(--panel2)}
.masset{display:flex;align-items:center;gap:8px;min-width:0}
.logo,.lfall{width:22px;height:22px;border-radius:50%;flex:0 0 auto}
.lfall{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--panel3);color:var(--amber)}
.mname{min-width:0}
.mtick{font-weight:600;letter-spacing:.03em;font-size:12.5px}
.mq{font-size:9px;font-weight:400}
.mfull{font-size:9px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.mprice{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.mvol{font-size:9px;color:var(--dim2)}
.mchg{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.flash-up{animation:fu .6s ease-out} .flash-dn{animation:fd .6s ease-out}
@keyframes fu{0%{background:rgba(31,191,117,.2)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(239,74,68,.2)}100%{background:transparent}}

/* оверлей */
.ov{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease-out}
.ov.on{transform:translateX(0)}
@media (prefers-reduced-motion:reduce){.ov{transition:none}}
.ov-h{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.ov-hb{display:flex;align-items:center;gap:10px;padding:7px 12px}
.back{background:none;border:0;color:var(--amber);font-size:12.5px;padding:2px 6px 2px 0;letter-spacing:.06em}
.ov-b{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + var(--safe-b))}

/* график */
.tfbar{display:flex;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
.tfbar::-webkit-scrollbar{display:none}
.tfbar button{flex:1 0 auto;min-width:44px;background:none;border:0;border-right:1px solid var(--line);padding:6px 4px;color:var(--dim2);font-size:10.5px}
.tfbar button.on{color:var(--amber);background:rgba(232,163,61,.08);box-shadow:inset 0 -2px 0 var(--amber)}
.chartwrap{position:relative;background:var(--bg)}
canvas{display:block;width:100%;touch-action:pan-y}
.readout{position:absolute;top:5px;left:6px;font-size:9.5px;color:var(--dim);background:rgba(10,11,13,.85);padding:2px 5px;border:1px solid var(--line);pointer-events:none;white-space:nowrap;max-width:calc(100% - 12px);overflow:hidden}
.zoombar{display:flex;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);align-items:center}
.ob{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.ob-c{background:var(--bg)}
.ob-r{display:flex;justify-content:space-between;padding:2px 8px;font-size:10px;font-variant-numeric:tabular-nums;position:relative;overflow:hidden}
.ob-r span{position:relative;z-index:1}
.ob-bar{position:absolute;top:0;bottom:0;right:0;opacity:.16}
.ob-bar.b{background:var(--up)} .ob-bar.a{background:var(--dn)}
.ob-mid{grid-column:1/3;background:var(--panel);text-align:center;padding:4px;font-size:10.5px;letter-spacing:.08em}

/* новости */
.nrow{padding:10px 12px;border-bottom:1px solid var(--line)}
.nrow:active{background:var(--panel2)}
.nmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;font-size:9px;color:var(--dim2);letter-spacing:.04em}
.ntitle{font-family:var(--sans);font-size:13.5px;line-height:1.35;margin-bottom:5px;color:var(--txt)}
.arth{font-family:var(--sans);font-size:18px;line-height:1.3;margin:8px 0 10px;font-weight:600}
.tier{padding:1px 4px;border-radius:2px;font-size:8.5px;letter-spacing:.05em;border:1px solid}
.tier.a{color:var(--up);border-color:rgba(31,191,117,.45)}
.tier.b{color:var(--amber);border-color:rgba(232,163,61,.45)}
.tier.c{color:var(--dn);border-color:rgba(239,74,68,.45)}
.imp{padding:1px 4px;border-radius:2px;font-size:8.5px;background:var(--panel3);color:var(--dim)}
.imp.h{background:rgba(239,74,68,.15);color:var(--dn)}
.imp.m{background:rgba(232,163,61,.15);color:var(--amber)}
.artbody{font-family:var(--sans);font-size:14px;line-height:1.6;color:#C9CDD3}
.artbody p{margin:0 0 12px}
.quote{border-left:2px solid var(--line2);padding:8px 0 8px 12px;color:var(--dim);font-size:12.5px;font-family:var(--sans);line-height:1.5}
.scen{border:1px solid var(--line);border-left-width:2px;padding:10px;margin-bottom:10px;font-family:var(--sans);font-size:12.5px;line-height:1.5}
.scen.t{border-left-color:var(--up)} .scen.f{border-left-color:var(--dn)}
.scen h4{margin:0 0 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ии */
.verdict{padding:14px 12px;text-align:center;border-bottom:1px solid var(--line)}
.vbig{font-size:28px;font-weight:700;letter-spacing:.1em;line-height:1.1}
.vconf{font-size:9.5px;color:var(--dim);letter-spacing:.14em;margin-top:4px}
.gauge{height:4px;background:var(--panel3);border-radius:2px;overflow:hidden;margin:10px auto 0;max-width:240px;position:relative}
.gauge i{position:absolute;top:0;bottom:0}
.tfline{display:grid;grid-template-columns:40px 1fr 54px;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);font-size:10.5px}
.bar{height:4px;background:var(--panel3);position:relative;border-radius:2px}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.plan div{background:var(--bg);padding:8px 12px}
.plan .lab{font-size:8.5px;letter-spacing:.12em;color:var(--dim2);margin-bottom:2px}
.plan .val{font-size:13.5px;font-variant-numeric:tabular-nums}

/* календарь событий */
.ev{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:start}
.evtime{font-size:11px;color:var(--amber);font-variant-numeric:tabular-nums;padding-top:1px}
.evt{font-family:var(--sans);font-size:12.5px;line-height:1.3}
.evs{font-size:9.5px;color:var(--dim2);margin-top:2px}

/* журнал — сетка дней */
.monthbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.navb{background:none;border:1px solid var(--line2);border-radius:2px;color:var(--amber);width:32px;height:28px;font-size:15px;line-height:1}
.mtitle{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.msum{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:var(--bg)}
.msum>div{padding:7px 8px;border-right:1px solid var(--line);text-align:center}
.msum>div:last-child{border-right:0}
.msum .l{display:block;font-size:8.5px;letter-spacing:.1em;color:var(--dim2);margin-bottom:2px}
.msum b{font-size:14px;font-variant-numeric:tabular-nums;font-weight:600}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:5px 8px 3px;font-size:8.5px;color:var(--dim2);letter-spacing:.1em;text-align:center}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 8px}
.day{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--panel)}
.day.pad-empty{border-color:transparent;background:transparent}
.day .dnum{position:absolute;top:3px;left:4px;font-size:8.5px;color:var(--dim2)}
.day .dpnl{font-size:11px;font-variant-numeric:tabular-nums;margin-top:5px}
.day .dcnt{font-size:7.5px;color:var(--dim2)}
.day.win{background:rgba(31,191,117,.13);border-color:rgba(31,191,117,.4)}
.day.win .dpnl{color:var(--up)}
.day.loss{background:rgba(239,74,68,.13);border-color:rgba(239,74,68,.4)}
.day.loss .dpnl{color:var(--dn)}
.day.flat .dpnl{color:var(--dim)}
.day.today{box-shadow:inset 0 0 0 1px var(--amber)}
.day:active{background:var(--panel3)}
.year{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px}
.ycell{border:1px solid var(--line);border-radius:3px;padding:5px 2px;text-align:center;background:var(--panel)}
.ycell .ym{display:block;font-size:8px;color:var(--dim2);letter-spacing:.08em}
.ycell .yv{font-size:10.5px;font-variant-numeric:tabular-nums}
.ycell.win .yv{color:var(--up)} .ycell.loss .yv{color:var(--dn)}
.ycell.cur{border-color:var(--amber-dim)}
.trow{padding:8px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.side{padding:1px 5px;font-size:9px;border-radius:2px;letter-spacing:.05em}
.side.l{background:rgba(31,191,117,.15);color:var(--up)}
.side.s{background:rgba(239,74,68,.15);color:var(--dn)}

/* шторка */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none}
.sheet.on{display:block}
.sheet-c{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-top:1px solid var(--line2);border-radius:10px 10px 0 0;padding:14px 14px calc(20px + var(--safe-b))}
.sheet-h{margin:-14px -14px 12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;background:var(--panel2);border-radius:10px 10px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + var(--safe-b));background:var(--panel3);border:1px solid var(--line2);padding:7px 13px;border-radius:2px;font-size:11.5px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media(min-width:700px){
  body{font-size:14px}
  .mrow,.thead{grid-template-columns:1fr 120px 92px;padding-left:22px;padding-right:22px}
  .pad,.nrow,.sec-h,.filters,.searchbar,.grp,.foot,.monthbar{padding-left:22px;padding-right:22px}
  .plan{grid-template-columns:repeat(4,1fr)}
  .ntitle{font-size:15px} .artbody{font-size:15px}
  .days,.dow{padding-left:16px;padding-right:16px}
  .day .dpnl{font-size:13px}
  .year{grid-template-columns:repeat(12,1fr)}
  .mfull{max-width:340px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hbar">
      <div class="brand">MURDOCK<span class="cursor"></span></div><span class="build">v4</span>
      <div class="hspace"></div>
      <div class="hstat" id="hstat"><span class="dot warn"></span>ПОДКЛЮЧЕНИЕ</div>
      <button class="iconbtn" id="btn-set">⚙</button>
    </div>
    <div class="tape" id="tape"></div>
  </header>
  <main id="main">
    <section class="page on" id="p-market"></section>
    <section class="page" id="p-news"></section>
    <section class="page" id="p-ai"></section>
    <section class="page" id="p-cal"></section>
    <section class="page" id="p-log"></section>
  </main>
  <nav id="nav">
    <button data-p="market" class="on"><span class="gl">▦</span>РЫНОК</button>
    <button data-p="news"><span class="gl">✎</span>НОВОСТИ</button>
    <button data-p="ai"><span class="gl">◈</span>ИИ-АНАЛИЗ</button>
    <button data-p="cal"><span class="gl">▤</span>СОБЫТИЯ</button>
    <button data-p="log"><span class="gl">∑</span>ЖУРНАЛ</button>
  </nav>
</div>
<div class="ov" id="ov">
  <div class="ov-h"><div class="ov-hb">
    <button class="back" id="ov-back">‹ НАЗАД</button>
    <div class="hspace"></div>
    <div id="ov-title" class="small muted"></div>
  </div></div>
  <div class="ov-b" id="ov-body"></div>
</div>
<div class="sheet" id="sheet"><div class="sheet-c" id="sheet-c"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ══════════════════════════════════════════════════════════════
   MURDOCK — терминал трейдера. Один файл, без зависимостей.

/* Открытые CORS-прокси: запасной путь, если своего сервера нет */
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u)
];
let proxyIdx = 0;
async function pget(url, timeout) {
  let err = null;
  if (SRV) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeout || 15000);
    try {
      const r = await fetch(API() + '/api/raw?u=' + encodeURIComponent(url), { signal: ctl.signal });
      if (r.ok) { const txt = await r.text(); if (txt && txt.length > 20) return txt; }
      err = new Error('сервер: HTTP ' + r.status);
    } catch (e) { err = e; } finally { clearTimeout(t); }
  }
  for (let i = 0; i < PROXIES.length; i++) {
    const p = PROXIES[(proxyIdx + i) % PROXIES.length];
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout || 14000);
    try {
      const r = await fetch(p(url), { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text();
      if (!txt || txt.length < 20) throw new Error('пустой ответ');
      proxyIdx = (proxyIdx + i) % PROXIES.length;
      return txt;
    } catch (e) { err = e; } finally { clearTimeout(t); }
  }
  throw err || new Error('прокси недоступны');
}

/* Stooq: дневные свечи по акциям, металлам, сырью и валютам */
const STOOQ_CACHE = {};
async function stooqDaily(sym, years) {
  const key = sym + '|' + (years || 2);
  const c = STOOQ_CACHE[key];
  if (c && Date.now() - c.ts < 900000) return c.data;
  const d2 = new Date(), d1 = new Date(Date.now() - (years || 2) * 365 * 864e5);
  const f = d => d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
  const csv = await pget('https://stooq.com/q/d/l/?s=' + encodeURIComponent(sym) + '&d1=' + f(d1) + '&d2=' + f(d2) + '&i=d');
  const lines = csv.trim().split('\n');
  if (lines.length < 3 || !/Date/i.test(lines[0])) throw new Error('нет данных Stooq');
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const p = lines[i].split(',');
    if (p.length < 5) continue;
    const o = +p[1], h = +p[2], l = +p[3], cl = +p[4], v = +(p[5] || 0);
    if (!isFinite(cl) || !cl) continue;
    out.push({ t: +new Date(p[0] + 'T00:00:00'), o: o, h: h, l: l, c: cl, v: v });
  }
  STOOQ_CACHE[key] = { ts: Date.now(), data: out };
  return out;
}
const Stooq = {
  async ticker(a) {
    const k = await stooqDaily(stSym(a), 2);
    if (k.length < 2) throw new Error('мало данных');
    const cur = k[k.length - 1], prev = k[k.length - 2];
    return { price: cur.c, chg: (cur.c - prev.c) / prev.c * 100, vol: cur.v * cur.c, high: cur.h, low: cur.l, open: cur.o, daily: true };
  },
  async klines(a, tf, limit) {
    const k = await stooqDaily(stSym(a), tf === '1w' ? 6 : 3);
    if (tf === '1w') {
      const out = [];
      let cur = null;
      k.forEach(c => {
        const d = new Date(c.t), wk = d.getFullYear() + '-' + Math.floor((+d) / 6048e5);
        if (!cur || cur.wk !== wk) { cur = { wk: wk, t: c.t, o: c.o, h: c.h, l: c.l, c: c.c, v: c.v }; out.push(cur); }
        else { cur.h = Math.max(cur.h, c.h); cur.l = Math.min(cur.l, c.l); cur.c = c.c; cur.v += c.v; }
      });
      return out.slice(-(limit || 300));
    }
    return k.slice(-(limit || 300));
  }
};

/* ─── 7. ИНДИКАТОРЫ (чистая математика по свечам) ─────────── */
function EMA(arr, n) {
  const k = 2 / (n + 1), out = new Array(arr.length).fill(null);
  let e = null;
  for (let i = 0; i < arr.length; i++) {
    if (i === n - 1) { let s = 0; for (let j = 0; j < n; j++) s += arr[j]; e = s / n; out[i] = e; }
    else if (i >= n) { e = arr[i] * k + e * (1 - k); out[i] = e; }
  }
  return out;
}
function SMA(arr, n) {
  const out = new Array(arr.length).fill(null); let s = 0;
  for (let i = 0; i < arr.length; i++) { s += arr[i]; if (i >= n) s -= arr[i - n]; if (i >= n - 1) out[i] = s / n; }
  return out;
}
function RSI(c, n) {
  const out = new Array(c.length).fill(null);
  if (c.length < n + 1) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; d >= 0 ? g += d : l -= d; }
  g /= n; l /= n;
  out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  for (let i = n + 1; i < c.length; i++) {
    const d = c[i] - c[i - 1];
    g = (g * (n - 1) + (d > 0 ? d : 0)) / n;
    l = (l * (n - 1) + (d < 0 ? -d : 0)) / n;
    out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }
  return out;
}
function MACD(c) {
  const f = EMA(c, 12), s = EMA(c, 26);
  const m = c.map((_, i) => (f[i] != null && s[i] != null) ? f[i] - s[i] : null);
  const valid = m.filter(x => x != null);
  const sigV = EMA(valid, 9);
  const sig = new Array(c.length).fill(null);
  let j = 0;
  for (let i = 0; i < c.length; i++) if (m[i] != null) { sig[i] = sigV[j]; j++; }
  return { macd: m, signal: sig, hist: m.map((v, i) => (v != null && sig[i] != null) ? v - sig[i] : null) };
}
function ATR(k, n) {
  const tr = k.map((x, i) => i === 0 ? x.h - x.l : Math.max(x.h - x.l, Math.abs(x.h - k[i - 1].c), Math.abs(x.l - k[i - 1].c)));
  return EMA(tr, n);
}
function BB(c, n, mult) {
  const m = SMA(c, n), up = [], lo = [];
  for (let i = 0; i < c.length; i++) {
    if (m[i] == null) { up.push(null); lo.push(null); continue; }
    let s = 0; for (let j = i - n + 1; j <= i; j++) s += (c[j] - m[i]) ** 2;
    const sd = Math.sqrt(s / n);
    up.push(m[i] + mult * sd); lo.push(m[i] - mult * sd);
  }
  return { mid: m, up: up, lo: lo };
}
const last = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };

/* Свинг-уровни: локальные экстремумы + кластеризация */
function levels(k, look) {
  look = look || 3;
  const hi = [], lo = [];
  for (let i = look; i < k.length - look; i++) {
    let ih = true, il = true;
    for (let j = i - look; j <= i + look; j++) {
      if (j === i) continue;
      if (k[j].h >= k[i].h) ih = false;
      if (k[j].l <= k[i].l) il = false;
    }
    if (ih) hi.push({ p: k[i].h, i: i });
    if (il) lo.push({ p: k[i].l, i: i });
  }
  const cluster = arr => {
    if (!arr.length) return [];
    const px = k[k.length - 1].c, tol = px * 0.006, out = [];
    arr.sort((a, b) => a.p - b.p);
    let grp = [arr[0]];
    for (let i = 1; i < arr.length; i++) {
      if (Math.abs(arr[i].p - grp[grp.length - 1].p) <= tol) grp.push(arr[i]);
      else { out.push(grp); grp = [arr[i]]; }
    }
    out.push(grp);
    return out.map(g => ({
      p: g.reduce((s, x) => s + x.p, 0) / g.length,
      n: g.length,
      recent: Math.max.apply(null, g.map(x => x.i))
    })).sort((a, b) => (b.n * 2 + b.recent / k.length) - (a.n * 2 + a.recent / k.length));
  };
  return { res: cluster(hi), sup: cluster(lo) };
}

/* Полный разбор одного таймфрейма */
function analyzeTF(k) {
  if (!k || k.length < 60) return null;
  const c = k.map(x => x.c), h = k.map(x => x.h), l = k.map(x => x.l), v = k.map(x => x.v);
  const px = c[c.length - 1];
  const e20 = EMA(c, 20), e50 = EMA(c, 50), e200 = EMA(c, 200);
  const rsi = RSI(c, 14), md = MACD(c), atr = ATR(k, 14), bb = BB(c, 20, 2);
  const E20 = last(e20), E50 = last(e50), E200 = last(e200);
  const R = last(rsi), A = last(atr) || (px * 0.01);
  const H = last(md.hist), Hp = md.hist[md.hist.length - 2];
  const volN = last(SMA(v, 20)), volNow = v[v.length - 1];

  /* структура рынка: сравниваем последние экстремумы */
  const lv = levels(k, 3);
  const hh = lv.res.slice(0, 6).sort((a, b) => a.recent - b.recent);
  const ll = lv.sup.slice(0, 6).sort((a, b) => a.recent - b.recent);
  let struct = 'диапазон';
  if (hh.length >= 2 && ll.length >= 2) {
    const upH = hh[hh.length - 1].p > hh[hh.length - 2].p, upL = ll[ll.length - 1].p > ll[ll.length - 2].p;
    if (upH && upL) struct = 'аптренд (HH/HL)';
    else if (!upH && !upL) struct = 'даунтренд (LH/LL)';
  }

  const sig = [];
  const add = (w, txt) => sig.push({ w: w, t: txt });
  if (E20 && E50) add(E20 > E50 ? 14 : -14, 'EMA20 ' + (E20 > E50 ? 'выше' : 'ниже') + ' EMA50');
  if (E200) add(px > E200 ? 16 : -16, 'цена ' + (px > E200 ? 'над' : 'под') + ' EMA200');
  if (E20) add(px > E20 ? 8 : -8, 'цена ' + (px > E20 ? 'над' : 'под') + ' EMA20');
  if (R != null) {
    if (R > 70) add(-10, 'RSI ' + R.toFixed(0) + ' — перекуплен');
    else if (R < 30) add(10, 'RSI ' + R.toFixed(0) + ' — перепродан');
    else add((R - 50) * 0.3, 'RSI ' + R.toFixed(0));
  }
  if (H != null) {
    add(H > 0 ? 10 : -10, 'MACD-гистограмма ' + (H > 0 ? 'положительная' : 'отрицательная'));
    if (Hp != null) add(Math.abs(H) > Math.abs(Hp) ? (H > 0 ? 5 : -5) : (H > 0 ? -3 : 3), 'импульс MACD ' + (Math.abs(H) > Math.abs(Hp) ? 'растёт' : 'слабеет'));
  }
  add(struct.startsWith('ап') ? 14 : struct.startsWith('даун') ? -14 : 0, 'структура: ' + struct);
  if (volN && volNow > volN * 1.5) add(px > c[c.length - 2] ? 7 : -7, 'объём ×' + (volNow / volN).toFixed(1) + ' к среднему');
  const bu = last(bb.up), bl = last(bb.lo);
  if (bu && bl) {
    const pos = (px - bl) / (bu - bl);
    if (pos > 0.98) add(-6, 'цена у верхней полосы Боллинджера');
    else if (pos < 0.02) add(6, 'цена у нижней полосы Боллинджера');
  }

  let raw = sig.reduce((s, x) => s + x.w, 0);
  const score = clamp(raw, -100, 100);
  return {
    px: px, score: score, signals: sig, struct: struct,
    rsi: R, atr: A, atrPct: A / px * 100, ema20: E20, ema50: E50, ema200: E200,
    macdH: H, levels: lv, volRatio: volN ? volNow / volN : null,
    bbW: (bu && bl) ? (bu - bl) / px * 100 : null,
    chg: (px - c[c.length - 2]) / c[c.length - 2] * 100
  };
}

/* Сводка по всем ТФ + торговый план */
const TF_W = { '5m': 0.5, '15m': 0.8, '1h': 1.4, '4h': 1.7, '1d': 2.0, '1w': 1.6 };
function buildPlan(byTF, px, extra) {
  let num = 0, den = 0, agree = 0, cnt = 0;
  TFS.forEach(t => {
    const a = byTF[t.k]; if (!a) return;
    num += a.score * TF_W[t.k]; den += TF_W[t.k]; cnt++;
  });
  const agg = den ? num / den : 0;
  TFS.forEach(t => { const a = byTF[t.k]; if (a && Math.sign(a.score) === Math.sign(agg) && Math.abs(a.score) > 8) agree++; });

  const dir = agg > 12 ? 'LONG' : agg < -12 ? 'SHORT' : 'ВНЕ РЫНКА';
  const base = byTF['1h'] || byTF['4h'] || byTF['15m'] || byTF['1d'] || byTF['1w'];
  if (!base) return null;
  const atr = base.atr;
  const lv = (byTF['4h'] || byTF['1d'] || base).levels;
  const sup = lv.sup.map(x => x.p).filter(p => p < px).sort((a, b) => b - a);
  const res = lv.res.map(x => x.p).filter(p => p > px).sort((a, b) => a - b);

  /* стоп: опираемся на уровень, но держим его в разумном коридоре от ATR,
     иначе на трендовом рынке ближайший свинг может оказаться в 30 ATR */
  const maxD = atr * 3.2, minD = atr * 1.1;
  let entry = px, sl, tps = [];
  if (dir === 'LONG') {
    entry = base.ema20 && base.ema20 < px ? Math.max(base.ema20, px - atr * 0.8) : px;
    const cand = sup.find(p => entry - p >= minD * 0.5 && entry - p <= maxD);
    sl = clamp(cand != null ? cand - atr * 0.35 : entry - atr * 1.8, entry - maxD, entry - minD);
    const r = entry - sl;
    const t1 = res.find(p => p - entry >= r * 0.9 && p - entry <= r * 2.6);
    tps = [t1 != null ? t1 : entry + r * 1.5, entry + r * 2.5, entry + r * 4];
  } else if (dir === 'SHORT') {
    entry = base.ema20 && base.ema20 > px ? Math.min(base.ema20, px + atr * 0.8) : px;
    const cand = res.find(p => p - entry >= minD * 0.5 && p - entry <= maxD);
    sl = clamp(cand != null ? cand + atr * 0.35 : entry + atr * 1.8, entry + minD, entry + maxD);
    const r = sl - entry;
    const t1 = sup.find(p => entry - p >= r * 0.9 && entry - p <= r * 2.6);
    tps = [t1 != null ? t1 : entry - r * 1.5, entry - r * 2.5, entry - r * 4];
  } else {
    sl = px - atr * 1.5;
    tps = [px + atr, px + atr * 2, px + atr * 3];
  }
  const risk = Math.abs(entry - sl);
  const rr = risk ? Math.abs(tps[1] - entry) / risk : 0;
  const conf = clamp(Math.round(Math.abs(agg) * 0.75 + (cnt ? agree / cnt : 0) * 30), 0, 96);
  const money = S.balance * (S.risk / 100);
  const qty = risk ? money / risk : 0;

  return {
    dir: dir, agg: agg, conf: conf, agree: agree, cnt: cnt,
    entry: entry, sl: sl, tps: tps, rr: rr, risk: risk,
    qty: qty, notional: qty * entry, money: money,
    sup: sup.slice(0, 3), res: res.slice(0, 3), atr: atr, extra: extra || {}
  };
}

/* ─── 8. СВЕЧНОЙ ГРАФИК (canvas, без библиотек) ───────────── */
const CS = { cv: null, ctx: null, k: [], n: 90, off: 0, cross: null, W: 0, H: 0, dpr: 1 };
const CSS_ = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

function chartInit(canvas, k) {
  CS.cv = canvas; CS.ctx = canvas.getContext('2d'); CS.k = k; CS.off = 0; CS.cross = null;
  CS.n = Math.min(k.length, window.innerWidth > 700 ? 140 : 80);
  chartResize();
  const pos = ev => {
    const r = CS.cv.getBoundingClientRect();
    const t = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const setCross = ev => {
    const p = pos(ev), g = geo();
    const i = Math.round((p.x - g.pl) / g.cw - 0.5);
    const st = CS.k.length - CS.n - CS.off;
    CS.cross = clamp(st + i, 0, CS.k.length - 1);
    chartDraw();
  };
  canvas.addEventListener('touchstart', e => { setCross(e); }, { passive: true });
  canvas.addEventListener('touchmove', e => { setCross(e); }, { passive: true });
  canvas.addEventListener('touchend', () => { setTimeout(() => { CS.cross = null; chartDraw(); }, 2500); }, { passive: true });
  canvas.addEventListener('mousemove', setCross);
  canvas.addEventListener('mouseleave', () => { CS.cross = null; chartDraw(); });
  if (!chartInit._rz) { chartInit._rz = 1; window.addEventListener('resize', () => { if (document.getElementById('a-canvas')) chartResize(); }); }
  chartDraw();
}
function chartResize() {
  if (!CS.cv) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = CS.cv.parentElement.clientWidth;
  const h = Math.round(clamp(window.innerHeight * 0.42, 250, 460));
  CS.cv.width = w * dpr; CS.cv.height = h * dpr;
  CS.cv.style.height = h + 'px';
  CS.W = w; CS.H = h; CS.dpr = dpr;
  CS.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  chartDraw();
}
function geo() {
  const pr = 60, pl = 2, pb = 18, vh = 42;
  const cw = (CS.W - pr - pl) / CS.n;
  return { pr: pr, pl: pl, pb: pb, vh: vh, cw: cw, top: 8, ph: CS.H - pb - vh - 12 };
}
function chartDraw() {
  if (!CS.ctx || !CS.k.length) return;
  const ctx = CS.ctx, g = geo();
  const st = Math.max(0, CS.k.length - CS.n - CS.off);
  const view = CS.k.slice(st, st + CS.n);
  if (!view.length) return;
  const line = CSS_('--line'), dim = CSS_('--dim2'), up = CSS_('--up'), dn = CSS_('--dn'), am = CSS_('--amber');
  ctx.clearRect(0, 0, CS.W, CS.H);

  let hi = -Infinity, lo = Infinity, vmax = 0;
  view.forEach(c => { hi = Math.max(hi, c.h); lo = Math.min(lo, c.l); vmax = Math.max(vmax, c.v); });
  const closes = CS.k.map(c => c.c);
  const e20 = EMA(closes, 20), e50 = EMA(closes, 50), e200 = EMA(closes, 200);
  [e20, e50, e200].forEach(a => { for (let i = st; i < st + view.length; i++) if (a[i] != null) { hi = Math.max(hi, a[i]); lo = Math.min(lo, a[i]); } });
  const padv = (hi - lo) * 0.08 || hi * 0.01;
  hi += padv; lo -= padv;
  const Y = p => g.top + (hi - p) / (hi - lo) * g.ph;
  const X = i => g.pl + i * g.cw + g.cw / 2;

  /* сетка + шкала цены */
  ctx.font = '9px ui-monospace,monospace'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const p = lo + (hi - lo) * i / 4, y = Y(p);
    ctx.strokeStyle = line; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(g.pl, y); ctx.lineTo(CS.W - g.pr, y); ctx.stroke();
    ctx.fillStyle = dim; ctx.textAlign = 'left';
    ctx.fillText(fmtP(p), CS.W - g.pr + 5, y);
  }

  /* объёмы */
  const vTop = g.top + g.ph + 12;
  view.forEach((c, i) => {
    const hgt = vmax ? (c.v / vmax) * g.vh : 0;
    ctx.fillStyle = c.c >= c.o ? up : dn; ctx.globalAlpha = 0.32;
    ctx.fillRect(X(i) - g.cw * 0.35, vTop + g.vh - hgt, Math.max(1, g.cw * 0.7), hgt);
  });
  ctx.globalAlpha = 1;

  /* свечи */
  view.forEach((c, i) => {
    const x = X(i), col = c.c >= c.o ? up : dn;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(0.7, g.cw * 0.09);
    ctx.beginPath(); ctx.moveTo(x, Y(c.h)); ctx.lineTo(x, Y(c.l)); ctx.stroke();
    const yo = Y(c.o), yc = Y(c.c), bw = Math.max(1, g.cw * 0.66);
    ctx.fillRect(x - bw / 2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yc - yo)));
  });

  /* EMA */
  const drawLine = (arr, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.globalAlpha = 0.85; ctx.beginPath();
    let started = false;
    for (let i = 0; i < view.length; i++) {
      const v = arr[st + i]; if (v == null) continue;
      const x = X(i), y = Y(v);
      started ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), started = true);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  };
  drawLine(e20, am, 1); drawLine(e50, CSS_('--blue'), 1); drawLine(e200, CSS_('--violet'), 1.2);

  /* последняя цена */
  const lastC = view[view.length - 1];
  const yl = Y(lastC.c);
  ctx.setLineDash([3, 3]); ctx.strokeStyle = lastC.c >= lastC.o ? up : dn; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(g.pl, yl); ctx.lineTo(CS.W - g.pr, yl); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = lastC.c >= lastC.o ? up : dn;
  ctx.fillRect(CS.W - g.pr + 2, yl - 7, g.pr - 4, 14);
  ctx.fillStyle = '#08090A'; ctx.textAlign = 'left'; ctx.font = 'bold 9px ui-monospace,monospace';
  ctx.fillText(fmtP(lastC.c), CS.W - g.pr + 5, yl);

  /* время */
  ctx.fillStyle = dim; ctx.font = '9px ui-monospace,monospace'; ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(view.length / 5));
  for (let i = 0; i < view.length; i += step) {
    const d = new Date(view[i].t);
    const lab = CS.tf && (CS.tf === '1d' || CS.tf === '1w') ? pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) : dTime(d);
    ctx.fillText(lab, X(i), CS.H - 7);
  }

  /* перекрестие */
  if (CS.cross != null && CS.cross >= st && CS.cross < st + view.length) {
    const i = CS.cross - st, c = CS.k[CS.cross], x = X(i);
    ctx.strokeStyle = CSS_('--dim'); ctx.lineWidth = 0.6; ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(x, g.top); ctx.lineTo(x, g.top + g.ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(g.pl, Y(c.c)); ctx.lineTo(CS.W - g.pr, Y(c.c)); ctx.stroke();
    ctx.setLineDash([]);
    const d = new Date(c.t), ch = (c.c - c.o) / c.o * 100;
    const ro = $('#readout');
    if (ro) ro.innerHTML = dDate(d) + ' ' + dTime(d) + '  O ' + fmtP(c.o) + '  H ' + fmtP(c.h) +
      '  L ' + fmtP(c.l) + '  C ' + fmtP(c.c) + '  <span class="' + cls(ch) + '">' + pct(ch) + '</span>  V ' + fmtV(c.v);
  } else {
    const ro = $('#readout');
    if (ro) ro.innerHTML = '<span class="am">EMA20</span> · <span style="color:var(--blue)">EMA50</span> · <span style="color:var(--violet)">EMA200</span> — коснись графика для деталей';
  }
}
function chartZoom(f) { CS.n = Math.round(clamp(CS.n * f, 25, Math.min(CS.k.length, 400))); CS.off = clamp(CS.off, 0, Math.max(0, CS.k.length - CS.n)); chartDraw(); }
function chartPan(d) { CS.off = clamp(CS.off + Math.round(CS.n * 0.3) * d, 0, Math.max(0, CS.k.length - CS.n)); chartDraw(); }

async function translate(text) {
  if (!S.translate || !text) return null;
  const key = text.slice(0, 110);
  if (TR_CACHE[key]) return TR_CACHE[key];
  if (/[а-яА-Я]{4}/.test(text)) return null;
  if (SRV) {
    try { const r = await apost('/api/translate', { texts: [text] }); const x = r.ru && r.ru[0]; if (x) { TR_CACHE[key] = x; saveTR(); return x; } } catch (e) {}
  }
  try {
    const chunks = text.match(/[\s\S]{1,1200}/g) || [];
    let out = '';
    for (const ch of chunks.slice(0, 3)) {
      const r = await jget('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=' + encodeURIComponent(ch), { timeout: 9000 });
      out += (r[0] || []).map(x => x[0]).join('');
    }
    if (out) { TR_CACHE[key] = out; saveTR(); return out; }
  } catch (e) {}
  return null;
}
/* Пачкой — одним запросом к серверу */
async function translateMany(texts) {
  const res = new Array(texts.length).fill(null);
  if (!S.translate) return res;
  const need = [], idx = [];
  texts.forEach((t, i) => { const k = t.slice(0, 110); if (TR_CACHE[k]) res[i] = TR_CACHE[k]; else if (!/[а-яА-Я]{4}/.test(t)) { need.push(t); idx.push(i); } });
  if (!need.length) return res;
  if (SRV) {
    try {
      const r = await apost('/api/translate', { texts: need });
      (r.ru || []).forEach((x, j) => { if (x) { res[idx[j]] = x; TR_CACHE[need[j].slice(0, 110)] = x; } });
      saveTR();
    } catch (e) {}
  } else {
    for (let j = 0; j < need.length; j++) { const x = await translate(need[j]); if (x) res[idx[j]] = x; }
  }
  return res;
}
const hashT = s => { s = String(s).toLowerCase().replace(/[^a-z0-9а-я]/g, '').slice(0, 120); let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const stripTags = h => String(h || '').replace(/<[^>]*>/g, ' ').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim();

function classify(n) {
  const hay = (n.title + ' ' + (n.body || '')).toLowerCase();
  const assets = [];
  ASSETS.forEach(a => {
    const t = a.s.toLowerCase();
    if (t.length < 3) { if (new RegExp('(^|[^a-z0-9])' + t + '([^a-z0-9]|$)').test(hay)) assets.push(a.s); return; }
    const nm = a.n.toLowerCase();
    if (new RegExp('(^|[^a-z0-9])' + t + '([^a-z0-9]|$)').test(hay) || (nm.length > 4 && hay.includes(nm))) assets.push(a.s);
  });
  if (/\b(gold|bullion)\b/.test(hay) && !assets.includes('XAUT')) assets.push('XAUT');
  if (/\b(oil|crude|wti|brent)\b/.test(hay) && !assets.includes('CL')) assets.push('CL');
  if (/\b(s&p|stocks|nasdaq|equities|wall street)\b/.test(hay) && !assets.includes('SPY')) assets.push('SPY');
  if (!assets.length && /\b(crypto|bitcoin|blockchain|fed|inflation)\b/.test(hay)) assets.push('BTC');
  const voices = [];
  VOICES.forEach(v => { if (hay.includes(v[0]) && !voices.includes(v[1])) voices.push(v[1]); });
  let imp = 0, impWords = [];
  IMPACT.forEach(x => x[1].forEach(k => { if (hay.includes(k)) { imp = Math.max(imp, x[0]); impWords.push(k); } }));
  let sent = 0;
  BULL.forEach(w => { if (hay.includes(w)) sent += 1; });
  BEAR.forEach(w => { if (hay.includes(w)) sent -= 1; });
  return { assets: assets.slice(0, 6), voices: voices.slice(0, 3), imp: imp, impWords: impWords.slice(0, 4), sent: clamp(sent, -5, 5), doubts: DOUBT.filter(d => hay.includes(d)) };
}

function parseFeed(xml, feed) {
  xml = String(xml).replace(/^\uFEFF/, '').trim();
  let doc = new DOMParser().parseFromString(xml, 'text/xml');
  if (doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(xml, 'text/html');
  let items = Array.from(doc.querySelectorAll('item'));
  if (!items.length) items = Array.from(doc.querySelectorAll('entry'));
  const txt = (el, tag) => { const x = el.querySelector(tag); return x ? x.textContent : ''; };
  return items.slice(0, 30).map(it => {
    let link = txt(it, 'link');
    if (!link) { const l = it.querySelector('link'); link = l ? l.getAttribute('href') : ''; }
    const dt = txt(it, 'pubDate') || txt(it, 'published') || txt(it, 'updated');
    const body = stripTags(txt(it, 'description') || txt(it, 'summary') || txt(it, 'content'));
    const title = stripTags(txt(it, 'title'));
    if (!title) return null;
    return { id: (link || title).slice(0, 120), title: title, body: body.slice(0, 1200), url: link, src: feed.n, ts: dt ? (+new Date(dt) || Date.now()) : Date.now() };
  }).filter(Boolean);
}

async function loadNews(force) {
  if (newsBusy) return;
  if (NEWS.length && !force && Date.now() - newsLoaded < 300000) return;
  newsBusy = true; newsErr = ''; newsSrcOK = 0;
  const bag = [];
  /* 1. Прямой агрегатор без прокси — если ответит, это самый быстрый путь */
  try {
    const r = await jget('https://min-api.cryptocompare.com/data/v2/news/?lang=EN&sortOrder=latest', { timeout: 9000 });
    (r.Data || []).forEach(n => bag.push({
      id: String(n.id), title: n.title, body: (n.body || '').slice(0, 1500), url: n.url,
      src: (n.source_info && n.source_info.name) || n.source || 'CryptoCompare', ts: (+n.published_on) * 1000
    }));
    if (bag.length) newsSrcOK++;
  } catch (e) {}
  /* 2. RSS открытых изданий через прокси */
  const jobs = FEEDS.map(f => pget(f.u, 15000).then(x => { const it = parseFeed(x, f); if (it.length) { newsSrcOK++; bag.push.apply(bag, it); } }).catch(() => {}));
  await Promise.all(jobs);

  if (!bag.length) { newsErr = 'ни один источник не ответил'; newsBusy = false; return; }
  const seen = {};
  NEWS = bag.filter(n => {
    const k = n.title.toLowerCase().replace(/[^a-zа-я0-9]/g, '').slice(0, 60);
    if (!k || seen[k]) return false; seen[k] = 1;
    return isFinite(n.ts) && n.ts > Date.now() - 7 * 864e5;
  }).map(n => { n.h = hashT(n.title); n.meta = classify(n); n.tier = srcTier(n.src); return n; });
  newsLoaded = Date.now();
  newsAIdone = 0;
  newsBusy = false;
}

/* ИИ на сервере размечает ленту: перевод, направление, сила, достоверность */
const REL_TXT = { 3: 'ИИ: ПОДТВЕРЖДЕНО', 2: 'ИИ: ТРЕБУЕТ ПРОВЕРКИ', 1: 'ИИ: СЛУХИ / МНЕНИЕ' };
const REL_CLS = { 3: 'a', 2: 'b', 1: 'c' };
function applyAI(n, x) {
  n.ai = x;
  if (x.ru) n.titleRu = x.ru;
  n.meta.sent = (+x.dir || 0) * 2;
  if (x.imp) n.meta.imp = +x.imp;
  if (Array.isArray(x.a) && x.a.length) n.meta.assets = x.a.filter(s => A_BY[s]).slice(0, 6);
}
async function aiEnrichNews() {
  if (!srvAI() || !NEWS.length || newsAIdone === newsLoaded) return false;
  newsAIdone = newsLoaded; newsAIerr = '';
  const top = NEWS.slice().sort((a, b) => b.ts - a.ts).slice(0, 40);
  try {
    const r = await apost('/api/ai/news', {
      tickers: ASSETS.map(a => a.s),
      items: top.map(n => ({ h: n.h, title: n.title, src: n.src, body: (n.body || '').slice(0, 300) }))
    });
    const map = r.map || {};
    NEWS.forEach(n => { if (map[n.h]) applyAI(n, map[n.h]); });
    return true;
  } catch (e) { newsAIerr = e.message; return false; }
}

const newsScore = n => n.meta.imp * 60 + (Date.now() - n.ts < 3 * 36e5 ? 40 : 0) - (Date.now() - n.ts) / 36e5;
function filteredNews() {
  let l = NEWS.slice();
  if (newsFilter === 'voices') l = l.filter(n => n.meta.voices.length);
  else if (newsFilter === 'high') l = l.filter(n => n.meta.imp >= 2);
  else if (newsFilter === 'trusted') l = l.filter(n => n.tier === 'a');
  else if (newsFilter !== 'all') l = l.filter(n => n.meta.assets.includes(newsFilter));
  return l.sort((a, b) => newsScore(b) - newsScore(a));
}

function scenarioTrue(n) {
  const m = n.meta, dir = m.sent > 0 ? 'вверх' : m.sent < 0 ? 'вниз' : 'без чёткого направления';
  const size = m.imp >= 3 ? 'резкое (единицы–десятки процентов по затронутым активам)' : m.imp === 2 ? 'заметное (проценты)' : 'ограниченное (шум внутри дня)';
  const who = m.assets.length ? m.assets.join(', ') : 'широкий рынок';
  const hay = (n.title + ' ' + n.body).toLowerCase();
  let extra = '';
  if (/etf/.test(hay)) extra = ' Потоки через ETF — это реальные деньги: смотри дневные данные притоков, они подтверждают или опровергают движение.';
  else if (/hack|exploit/.test(hay)) extra = ' После взломов первая реакция — паника; часто откуп в течение 24–72 часов, если протокол компенсирует потери.';
  else if (/rate|fed|fomc|cpi|inflation/.test(hay)) extra = ' Макро бьёт по всему сразу: BTC ведёт, альты усиливают движение плечом, золото и индексы реагируют раньше крипты.';
  else if (/tariff|opec|oil/.test(hay)) extra = ' Сырьё и валюты отыгрывают такие новости быстрее крипты — смотри на нефть и доллар как на опережающий сигнал.';
  else if (/lawsuit|sec|regulat|ban/.test(hay)) extra = ' Регуляторные истории обычно идут в два такта: паника на заголовке, откат после разбора деталей.';
  else if (/unlock|vesting/.test(hay)) extra = ' Разлоки — это будущее предложение: смотри процент от циркуляции, до 1% рынок обычно переваривает.';
  return 'Если новость подтвердится, движение по ' + who + ' — ' + dir + '. Масштаб: ' + size + '.' + extra +
    ' Подтверждение выглядит так: цена уходит за уровень с ростом объёма, открытый интерес растёт вместе с ценой, фандинг не улетает в крайности.';
}
function scenarioFalse(n) {
  const m = n.meta, who = m.assets.length ? m.assets.join(', ') : 'рынок';
  const back = m.sent > 0 ? 'откат вниз, часто ниже уровня до новости — купившие на заголовке остаются в ловушке'
    : m.sent < 0 ? 'выкуп вверх — шортисты на заголовке попадают под сквиз' : 'возврат в исходный диапазон';
  const dq = m.doubts.length ? ' В тексте уже есть маркеры неподтверждённости (' + m.doubts.join(', ') + ') — вероятность опровержения выше среднего.' : '';
  return 'Если новость не подтвердится или окажется искажённой, по ' + who + ' вероятен ' + back + '.' + dq +
    ' Признаки фальстарта: движение без роста объёма, ОИ падает при движении цены, нет подтверждения от первичного источника в течение 1–2 часов.';
}
function verifyHints(n) {
  const hay = (n.title + ' ' + n.body).toLowerCase(), out = [];
  if (/sec|lawsuit|filing/.test(hay)) out.push('Первоисточник: реестр SEC (EDGAR) — есть ли реальная подача документа.');
  if (/fed|fomc|rate|powell/.test(hay)) out.push('Первоисточник: пресс-релиз ФРС и стенограмма выступления, а не пересказ.');
  if (/trump|white house|president/.test(hay)) out.push('Первоисточник: официальный аккаунт или стенограмма — заголовки часто вырывают фразу из контекста.');
  if (/etf|inflow|outflow/.test(hay)) out.push('Первоисточник: дневные данные потоков эмитентов ETF.');
  if (/hack|exploit|drain/.test(hay)) out.push('Первоисточник: пост команды протокола и он-чейн транзакции.');
  if (/earnings|quarterly/.test(hay)) out.push('Первоисточник: отчёт компании и её пресс-релиз, а не заголовок про «превзошла ожидания».');
  out.push('Проверь, есть ли та же новость у Reuters/Bloomberg. Если только у одного мелкого сайта — красный флаг.');
  return out;
}

const LLM_DEF = { openai: 'gpt-4o-mini', anthropic: 'claude-sonnet-5', openrouter: 'anthropic/claude-3.5-sonnet' };
const llmOn = () => srvAI() || (S.llm.provider !== 'none' && !!S.llm.key);

async function llmAsk(system, user, opts) {
  opts = opts || {};
  if (srvAI()) {
    const r = await apost('/api/ai', { system: system, prompt: user, web: !!opts.web, fast: !!opts.fast });
    return r.text || '(пустой ответ модели)';
  }
  const p = S.llm.provider, key = S.llm.key, model = S.llm.model || LLM_DEF[p];
  if (!llmOn()) throw new Error('ИИ не подключён: введи PIN в ⚙ → Сервер или ключ модели в ⚙ → ИИ-модель.');
  if (p === 'anthropic') {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: model, max_tokens: 1600, system: system, messages: [{ role: 'user', content: user }] })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 160));
    const d = await r.json();
    return (d.content || []).map(x => x.text || '').join('\n').trim();
  }
  const base = p === 'openrouter' ? 'https://openrouter.ai/api/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
  const r = await fetch(base, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + key },
    body: JSON.stringify({ model: model, max_tokens: 1600, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 160));
  const d = await r.json();
  return d.choices[0].message.content.trim();
}
function mdLite(t) {
  return esc(t)
    .replace(/^### (.*)$/gm, '<b class="am">$1</b>')
    .replace(/^## (.*)$/gm, '<b class="am">$1</b>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/^[-•] (.*)$/gm, '· $1')
    .replace(/\n/g, '<br>');
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Промпт скопирован'), () => toast('Не удалось скопировать'));
  else { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Промпт скопирован'); }
}

async function runAI(sym) {
  if (aiBusy) return;
  aiBusy = true;
  const out = $('#ai-out');
  out.innerHTML = '<div class="loading">СЧИТАЮ ' + esc(sym) + ' ПО ВСЕМ ТАЙМФРЕЙМАМ…</div>';
  try {
    const a = A_BY[sym];
    const byTF = {};
    for (const t of TFS) {
      if (!isCrypto(a) && t.k !== '1d' && t.k !== '1w') { byTF[t.k] = null; continue; }
      try { byTF[t.k] = analyzeTF(await getKlines(sym, t.k, 400)); } catch (e) { byTF[t.k] = null; }
    }
    let extra = {};
    if (isCrypto(a)) { try { extra = await DP.extra(bnSym(a)); } catch (e) {} }
    await loadMacro();
    const px = (MKT[sym] && MKT[sym].price) || (byTF['1h'] && byTF['1h'].px) || (byTF['1d'] && byTF['1d'].px);
    const plan = buildPlan(byTF, px, extra);
    aiData = { sym: sym, byTF: byTF, plan: plan, extra: extra, px: px, ts: Date.now() };
    drawAI();
  } catch (e) {

}

function nthWeekday(y, m, wd, n) {
  const d = new Date(y, m, 1); let c = 0;
  while (d.getMonth() === m) { if (d.getDay() === wd) { c++; if (c === n) return new Date(d); } d.setDate(d.getDate() + 1); }
  return null;
}
function lastWeekday(y, m, wd) { const d = new Date(y, m + 1, 0); while (d.getDay() !== wd) d.setDate(d.getDate() - 1); return d; }
function genEvents(months) {
  const out = [], now = new Date();
  for (let i = 0; i < (months || 3); i++) {
    const b = new Date(now.getFullYear(), now.getMonth() + i, 1), Y = b.getFullYear(), M = b.getMonth();
    const nfp = nthWeekday(Y, M, 5, 1);
    if (nfp) { nfp.setHours(15, 30); out.push({ d: +nfp, t: 'Отчёт по занятости в США (NFP)', s: 'бьёт по всем рынкам сразу', imp: 3, gen: 1 }); }
    const exp = lastWeekday(Y, M, 5); exp.setHours(11, 0);
    const q = [2, 5, 8, 11].indexOf(M) >= 0;
    out.push({ d: +exp, t: (q ? 'Квартальная' : 'Месячная') + ' экспирация опционов BTC/ETH', s: 'всплеск волатильности у крупных страйков', imp: q ? 3 : 2, gen: 1 });
    for (let w = 1; w <= 5; w++) { const th = nthWeekday(Y, M, 4, w); if (th) { th.setHours(15, 30); out.push({ d: +th, t: 'Заявки на пособие по безработице (США)', s: 'еженедельно', imp: 1, gen: 1 }); } }

}

   (новее — побеждает, удаление помнится), всё в одном запросе */
let syncState = '', syncT = null, syncBusy = false;

function pnlOf(t) {
  if (t.open) { const px = MKT[t.sym] && MKT[t.sym].price ? MKT[t.sym].price : t.entry; return (t.side === 'long' ? px - t.entry : t.entry - px) * t.qty - (t.fee || 0); }
  return (t.side === 'long' ? t.exit - t.entry : t.entry - t.exit) * t.qty - (t.fee || 0);
}
function rOf(t) { if (!t.sl) return null; const risk = Math.abs(t.entry - t.sl) * t.qty; return risk ? pnlOf(t) / risk : null; }
const tDate = t => new Date(t.closed || t.opened);
function stats(list) {
  const n = list.length;
  const wins = list.filter(t => pnlOf(t) > 0), loss = list.filter(t => pnlOf(t) < 0);
  const sum = list.reduce((s, t) => s + pnlOf(t), 0);
  const gw = wins.reduce((s, t) => s + pnlOf(t), 0), gl = Math.abs(loss.reduce((s, t) => s + pnlOf(t), 0));
  let eq = 0, peak = 0, dd = 0;
  list.slice().sort((a, b) => tDate(a) - tDate(b)).forEach(t => { eq += pnlOf(t); peak = Math.max(peak, eq); dd = Math.min(dd, eq - peak); });
  const rs = list.map(rOf).filter(x => x != null);
  return { n: n, sum: sum, win: n ? wins.length / n * 100 : 0, avgW: wins.length ? gw / wins.length : 0, avgL: loss.length ? gl / loss.length : 0, pf: gl ? gw / gl : (gw ? 99 : 0), dd: dd, avgR: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null };
}
function groupBy(list, fn) {
  const g = {}; list.forEach(t => { const k = fn(t); (g[k] = g[k] || []).push(t); });
  return Object.keys(g).map(k => ({ k: k, list: g[k], sum: g[k].reduce((s, t) => s + pnlOf(t), 0), win: g[k].filter(t => pnlOf(t) > 0).length / g[k].length * 100 }));
}
const closedTrades = () => TRADES.filter(t => !t.open);

function advice() {
  const all = closedTrades(), out = [];
  if (all.length < 5) { out.push('Пока мало сделок (' + all.length + '). Статистика начнёт что-то значить после 20–30 записей — записывай всё, включая мелкие.'); return out; }
  const st = stats(all);
  if (st.avgL > st.avgW && st.avgW > 0) out.push('Средний убыток ($' + fmtN(st.avgL) + ') больше средней прибыли ($' + fmtN(st.avgW) + '). Либо стоп слишком далеко, либо тейк слишком близко — целься минимум в 1:2.');
  if (st.pf < 1) out.push('Профит-фактор ' + st.pf.toFixed(2) + ' — стратегия в минусе. Не увеличивай объём, пока не найдёшь, какие сетапы дают минус.');
  else if (st.win < 40 && st.pf > 1.2) out.push('Винрейт ' + st.win.toFixed(0) + '% при профит-факторе ' + st.pf.toFixed(2) + ' — нормальная трендовая статистика: побед мало, но крупные. Главное — не резать прибыль раньше времени.');
  const bySide = groupBy(all, t => t.side);
  if (bySide.length === 2) {
    const l = bySide.find(x => x.k === 'long'), s = bySide.find(x => x.k === 'short');
    if (l && s && Math.abs(l.win - s.win) > 20) {
      const bad = l.win < s.win ? l : s, good = bad === l ? s : l;
      out.push((bad.k === 'long' ? 'Лонги' : 'Шорты') + ' работают заметно хуже (' + bad.win.toFixed(0) + '% против ' + good.win.toFixed(0) + '%). Либо торгуй сильную сторону, либо разбери, чем отличается вход в слабую.');
    }
  }
  const byAsset = groupBy(all, t => t.sym).sort((a, b) => a.sum - b.sum);
  if (byAsset.length > 2) {
    const w = byAsset[0], b = byAsset[byAsset.length - 1];
    if (w.sum < 0 && w.list.length >= 3) out.push(esc(w.k) + ' стабильно съедает депозит: ' + w.list.length + ' сделок, итог $' + fmtN(w.sum) + '. Пауза по инструменту сэкономит больше, чем новая стратегия.');
    if (b.sum > 0 && b.list.length >= 3) out.push('Лучший инструмент — ' + esc(b.k) + ' ($' + fmtN(b.sum) + ' за ' + b.list.length + ' сделок). Туда и стоит смещать фокус.');
  }
  const byHour = groupBy(all, t => new Date(t.opened).getHours());
  const badH = byHour.filter(h => h.list.length >= 3).sort((a, b) => a.sum - b.sum)[0];
  if (badH && badH.sum < 0) out.push('Худшее время входа — около ' + badH.k + ':00 (' + badH.list.length + ' сделок, $' + fmtN(badH.sum) + '). Обычно это усталость или тонкая ликвидность, а не рынок.');
  const byDow = groupBy(all, t => new Date(t.opened).getDay());
  const badD = byDow.filter(h => h.list.length >= 3).sort((a, b) => a.sum - b.sum)[0];
  if (badD && badD.sum < 0) out.push('Худший день недели — ' + ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'][+badD.k] + ' ($' + fmtN(badD.sum) + ').');
  const noSL = all.filter(t => !t.sl).length;
  if (noSL / all.length > 0.3) out.push(Math.round(noSL / all.length * 100) + '% сделок записаны без стопа. Без стопа не посчитать R — и обычно не посчитан риск в моменте.');
  const lev = all.filter(t => t.lev && t.lev >= 20);
  if (lev.length >= 3) { const s = lev.reduce((a, t) => a + pnlOf(t), 0); if (s < 0) out.push('Сделки с плечом 20x+ дали $' + fmtN(s) + ' за ' + lev.length + ' входов. Попробуй тот же сетап с 5–10x и более широким стопом.'); }
  let streak = 0, worst = 0;
  all.slice().sort((a, b) => tDate(a) - tDate(b)).forEach(t => { if (pnlOf(t) < 0) { streak++; worst = Math.max(worst, streak); } else streak = 0; });
  if (worst >= 4) out.push('Была серия из ' + worst + ' убытков подряд. Правило: после 3 минусов подряд — стоп на день, это дешевле, чем отыгрываться.');
  if (st.dd < 0 && Math.abs(st.dd) > S.balance * 0.2) out.push('Просадка $' + fmtN(Math.abs(st.dd)) + ' — больше 20% депозита. Риск на сделку стоит уменьшить.');
  if (!out.length) out.push('Статистика ровная: профит-фактор ' + st.pf.toFixed(2) + ', винрейт ' + st.win.toFixed(0) + '%. Явных утечек не видно — держи тот же риск.');
  return out;
}

function monthGrid() {
  const y = logMon.getFullYear(), m = logMon.getMonth();
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  let lead = first.getDay() - 1; if (lead < 0) lead = 6;
  const byDay = {};
  TRADES.filter(t => !t.open).forEach(t => { const d = tDate(t); if (d.getFullYear() === y && d.getMonth() === m) { const k = d.getDate(); byDay[k] = byDay[k] || { sum: 0, n: 0 }; byDay[k].sum += pnlOf(t); byDay[k].n++; } });
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="day pad-empty"></div>';
  const today = new Date();
  for (let d = 1; d <= days; d++) {
    const x = byDay[d];
    const isToday = today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;
    let c = 'day';
    if (x) c += x.sum > 0 ? ' win' : x.sum < 0 ? ' loss' : ' flat';
    if (isToday) c += ' today';
    cells += '<div class="' + c + '" data-day="' + d + '">' +
      '<span class="dnum">' + d + '</span>' +
      (x ? '<span class="dpnl">' + (x.sum >= 0 ? '+' : '−') + fmtN(Math.abs(x.sum), Math.abs(x.sum) >= 100 ? 0 : 1) + '</span><span class="dcnt">' + x.n + ' сд.</span>' : '<span class="dpnl dim2">·</span>') +
      '</div>';
  }
  return cells;
}

function equityCanvas(list) {
  setTimeout(() => {
    const cv = $('#eq'); if (!cv) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3), w = cv.parentElement.clientWidth - 24, h = 96;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px'; cv.style.width = w + 'px';
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const srt = list.slice().sort((a, b) => tDate(a) - tDate(b));
    if (srt.length < 2) { ctx.fillStyle = CSS_('--dim2'); ctx.font = '11px ui-monospace'; ctx.fillText('мало данных для кривой', 4, h / 2); return; }
    let eq = 0; const pts = srt.map(t => (eq += pnlOf(t)));
    const mx = Math.max.apply(null, pts.concat([0])), mn = Math.min.apply(null, pts.concat([0]));
    const Y = v => h - 8 - (v - mn) / ((mx - mn) || 1) * (h - 16);
    ctx.strokeStyle = CSS_('--line'); ctx.lineWidth = .6;
    ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(w, Y(0)); ctx.stroke();
    ctx.beginPath();
    pts.forEach((v, i) => { const x = i / (pts.length - 1) * w; i ? ctx.lineTo(x, Y(v)) : ctx.moveTo(x, Y(v)); });
    ctx.strokeStyle = pts[pts.length - 1] >= 0 ? CSS_('--up') : CSS_('--dn'); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.lineTo(w, Y(0)); ctx.lineTo(0, Y(0)); ctx.closePath();
    ctx.globalAlpha = .12; ctx.fillStyle = ctx.strokeStyle; ctx.fill(); ctx.globalAlpha = 1;
  }, 30);
}
