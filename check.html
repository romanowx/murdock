<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<title>Проверка связи</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#0A0D12;color:#E9EEF6;
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
h1{font-size:21px;margin:0 0 4px}
.sub{color:#8695A8;font-size:14px;margin-bottom:18px}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5C6B7E;
  margin:24px 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #1E2734}
.dot{width:11px;height:11px;border-radius:50%;background:#2A3644;flex:0 0 auto}
.dot.ok{background:#2FBF71}.dot.bad{background:#E8603C}.dot.wait{background:#E5A93D}
.nm{flex:1;min-width:0;font-weight:600}
.st{font-size:14px;color:#8695A8;font-variant-numeric:tabular-nums;text-align:right}
.st.ok{color:#2FBF71}.st.bad{color:#E8603C}
.verdict{margin-top:26px;padding:16px;border-radius:12px;font-size:16px;line-height:1.55}
.v-ok{background:rgba(47,191,113,.12);border:1px solid rgba(47,191,113,.4);color:#7EE2AC}
.v-bad{background:rgba(232,96,60,.12);border:1px solid rgba(232,96,60,.45);color:#F0937A}
.big{font-size:42px;font-weight:800;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;
  background:#E9EEF6;color:#0A0D12;font-size:17px;font-weight:700}
.env{margin-top:20px;font-size:13px;color:#5C6B7E;line-height:1.6;word-break:break-all}
</style>
</head>
<body>

<h1>Проверка связи</h1>
<div class="sub">Эта страница ничего не показывает и не грузит новости. Она только проверяет, что из вашей сети доступно. Дождитесь конца и пришлите снимок экрана.</div>

<h2>Зеркала для новостей</h2>
<div id="mirrors"></div>

<h2>Переводчики</h2>
<div id="trans"></div>

<div id="verdict"></div>
<button onclick="location.reload()">Проверить заново</button>

<div class="env" id="env"></div>

<script>
var FEED = 'https://forklog.com/feed/';

var MIRRORS = [
  ['AllOrigins',   'https://api.allorigins.win/raw?url=' + encodeURIComponent(FEED)],
  ['CodeTabs',     'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(FEED)],
  ['CorsProxy',    'https://corsproxy.io/?url=' + encodeURIComponent(FEED)],
  ['AllOrigins-2', 'https://api.allorigins.win/get?url=' + encodeURIComponent(FEED)],
  ['Cors.lol',     'https://api.cors.lol/?url=' + encodeURIComponent(FEED)],
  ['RSS2JSON',     'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(FEED)],
  ['Feed2JSON',    'https://feed2json.org/convert?url=' + encodeURIComponent(FEED)],
  ['Jina',         'https://r.jina.ai/' + FEED]
];

var TRANS = [
  ['Google',        'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=Gold%20price%20rises'],
  ['Google Chrome', 'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=ru&q=Gold%20price%20rises'],
  ['Lingva',        'https://lingva.ml/api/v1/en/ru/Gold%20price%20rises'],
  ['Lingva 2',      'https://translate.plausibility.cloud/api/v1/en/ru/Gold%20price%20rises'],
  ['SimplyTranslate','https://simplytranslate.org/api/translate/?engine=google&from=en&to=ru&text=Gold%20price%20rises'],
  ['MyMemory',      'https://api.mymemory.translated.net/get?langpair=en|ru&q=Gold%20price%20rises']
];

var okMirrors = 0, okTrans = 0, done = 0, total = MIRRORS.length + TRANS.length;

function row(box, name) {
  var d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<span class="dot wait"></span><span class="nm"></span><span class="st">проверяю…</span>';
  d.querySelector('.nm').textContent = name;
  document.getElementById(box).appendChild(d);
  return d;
}

function mark(el, ok, text) {
  el.querySelector('.dot').className = 'dot ' + (ok ? 'ok' : 'bad');
  var st = el.querySelector('.st');
  st.className = 'st ' + (ok ? 'ok' : 'bad');
  st.textContent = text;
}

function test(url, ms) {
  var c = new AbortController();
  var t = setTimeout(function(){ c.abort(); }, ms || 12000);
  return fetch(url, { signal: c.signal, cache: 'no-store' }).then(function(r){
    clearTimeout(t);
    if (!r.ok) throw new Error('код ' + r.status);
    return r.text();
  }).then(function(txt){
    if (!txt || txt.length < 40) throw new Error('пустой ответ');
    return txt;
  });
}

function finish() {
  done++;
  if (done < total) return;
  var v = document.getElementById('verdict');
  var cls, msg;
  if (okMirrors > 0 && okTrans > 0) {
    cls = 'v-ok';
    msg = '<b>Всё в порядке.</b> Работает зеркал: ' + okMirrors + ' из ' + MIRRORS.length +
          ', переводчиков: ' + okTrans + ' из ' + TRANS.length +
          '. Сайт должен грузиться и переводить. Если он всё равно пустой — дело в самом сайте, пришлите этот экран.';
  } else if (okMirrors === 0) {
    cls = 'v-bad';
    msg = '<b>Ни одно зеркало не отвечает.</b> Новости взять неоткуда. Обычно причина одна из трёх: ' +
          'страница открыта файлом с диска, а не по адресу сайта; ' +
          'включён блокировщик рекламы или VPN; ' +
          'провайдер режет эти адреса. Попробуйте другую сеть — например, мобильный интернет вместо Wi-Fi.';
  } else {
    cls = 'v-bad';
    msg = '<b>Новости пройдут, а перевод — нет.</b> Зеркала работают (' + okMirrors + '), ' +
          'но переводчики недоступны. Пришлите этот экран, подключу другие.';
  }
  v.className = 'verdict ' + cls;
  v.innerHTML = '<div class="big">' + okMirrors + ' / ' + okTrans + '</div>' + msg;
}

MIRRORS.forEach(function(m){
  var el = row('mirrors', m[0]);
  var t0 = Date.now();
  test(m[1]).then(function(){
    okMirrors++;
    mark(el, true, (Date.now() - t0) + ' мс');
  }).catch(function(e){
    mark(el, false, e.name === 'AbortError' ? 'таймаут' : (e.message || 'нет ответа'));
  }).then(finish);
});

TRANS.forEach(function(m){
  var el = row('trans', m[0]);
  var t0 = Date.now();
  test(m[1], 10000).then(function(txt){
    var ru = /[\u0400-\u04FF]/.test(txt);
    if (ru) okTrans++;
    mark(el, ru, ru ? (Date.now() - t0) + ' мс' : 'ответил без перевода');
  }).catch(function(e){
    mark(el, false, e.name === 'AbortError' ? 'таймаут' : (e.message || 'нет ответа'));
  }).then(finish);
});

document.getElementById('env').textContent =
  'Адрес: ' + location.href + '\n' +
  'Протокол: ' + location.protocol + (location.protocol === 'file:' ? '  ← файл с диска, запросы будут блокироваться' : '') +
  '\nВо встроенном окне: ' + (window.self !== window.top ? 'да ← это тоже блокирует запросы' : 'нет');
</script>
</body>
</html>
